<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Requests — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-page-title="My Requests">
  <div id="app">
    <div class="card">
      <div class="card-body">
        <div class="card-header-row">
          <h2>My booking requests</h2>
          <a href="booking-form.html" class="btn btn-primary btn-sm">+ New request</a>
        </div>
        <div id="requests-table"></div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../js/app.js';
    import { getBookings } from '../js/api.js';
    import { dataTable } from '../components/data-table.js';
    import { statusBadge } from '../components/status-badge.js';
    import { formatDate, formatTime } from '../js/utils.js';

    window.__pageInit = async function () {
      const el = document.getElementById('requests-table');
      try {
        const data = await getBookings({ scope: 'mine' });
        const list = Array.isArray(data) ? data : data?.items || [];
        dataTable({
          container: el,
          columns: [
            { key: 'ref', label: 'Reference', render: (r) => r.ref || r.id || '—' },
            { key: 'venue', label: 'Venue', render: (r) => r.venueName || r.venue || '—' },
            { key: 'date', label: 'Date', render: (r) => formatDate(r.date) },
            { key: 'time', label: 'Time', render: (r) => `${formatTime(r.startTime)} – ${formatTime(r.endTime)}`, sortable: false },
            { key: 'status', label: 'Status', render: (r) => statusBadge(r.status), sortable: false },
          ],
          rows: list,
          empty: {
            title: 'No booking requests found.',
            hint: 'Submit a request to reserve a venue.',
            actionLabel: 'New request',
            actionHref: 'booking-form.html',
          },
          onRowClick: (row) => { window.location.href = `booking-details.html?id=${encodeURIComponent(row.id)}`; },
        });
      } catch {
        dataTable({
          container: el, columns: [], rows: [],
          empty: { title: 'No booking requests found.', hint: 'Submit a request to reserve a venue.', actionLabel: 'New request', actionHref: 'booking-form.html' },
        });
      }
    };
  </script>
</body>
</html>
