<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Venue Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Inter Tight"', 'system-ui', 'sans-serif'],
          },
          colors: {
            paper: '#faf8f5',
            ink: '#1a1815',
            muted: '#6b6560',
            rule: '#e8e4dd',
            accent: '#3d6b66',
            'accent-soft': '#e6efee',
            clay: '#b5623f',
          },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: {
            card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)',
          },
        },
      },
    };
  </script>
  <style>
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url('/assets/noise.svg');
      background-repeat: repeat;
    }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased min-h-screen">
  <div class="min-h-screen grid lg:grid-cols-[1fr_1.05fr]">
    <!-- Brand panel -->
    <div class="hidden lg:flex flex-col justify-between bg-ink text-paper px-14 xl:px-20 py-14 relative overflow-hidden">
      <div class="relative z-10">
        <p class="font-display text-[28px] font-semibold tracking-[-0.035em] leading-none">Venue</p>
        <p class="mt-2 text-[10px] uppercase tracking-[0.16em] text-paper/35 font-medium">Booking System</p>
      </div>
      <div class="relative z-10 max-w-[320px]">
        <div class="h-px w-10 bg-paper/20 mb-8"></div>
        <p class="font-display text-[26px] xl:text-[28px] font-medium tracking-[-0.03em] leading-[1.25] text-paper/90">
          Reserve spaces.<br />Align teams.<br />Keep every booking accountable.
        </p>
      </div>
      <p class="relative z-10 text-[11px] text-paper/25 tracking-[0.08em] uppercase">Internal use only</p>
    </div>

    <!-- Form panel -->
    <div class="flex items-center justify-center px-6 py-12 sm:px-10 sm:py-16">
      <div class="w-full max-w-[360px]">
        <div class="lg:hidden mb-12">
          <p class="font-display text-2xl font-semibold tracking-[-0.03em]">Venue</p>
          <p class="mt-1 text-[10px] uppercase tracking-[0.14em] text-muted">Booking System</p>
        </div>

        <h1 class="font-display text-[26px] font-medium tracking-[-0.03em] text-ink">Sign in</h1>
        <p class="mt-2 text-[14px] text-muted leading-relaxed">Use your company credentials to continue.</p>

        <form id="login-form" class="mt-10 space-y-5" novalidate>
          <div>
            <label for="email" class="block text-[10px] uppercase tracking-[0.1em] text-muted mb-2 font-medium">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="username"
              class="w-full border border-rule rounded-sm px-3.5 py-3 text-[14px] bg-paper text-ink placeholder:text-muted/40 focus:outline-none focus:border-ink/40 focus:ring-1 focus:ring-ink/10 transition-colors duration-150"
              placeholder="you@company.com"
            />
          </div>
          <div>
            <label for="password" class="block text-[10px] uppercase tracking-[0.1em] text-muted mb-2 font-medium">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              class="w-full border border-rule rounded-sm px-3.5 py-3 text-[14px] bg-paper text-ink placeholder:text-muted/40 focus:outline-none focus:border-ink/40 focus:ring-1 focus:ring-ink/10 transition-colors duration-150"
              placeholder="••••••••"
            />
          </div>

          <div id="login-error" class="hidden border border-clay/30 bg-clay/5 text-ink text-[13px] px-3.5 py-3 rounded-sm leading-relaxed" role="alert"></div>

          <button
            type="submit"
            id="login-submit"
            class="w-full bg-ink text-paper text-[13px] font-medium py-3 rounded-sm hover:bg-ink/90 transition-colors duration-150 disabled:opacity-50 tracking-wide mt-1"
          >
            Sign in
          </button>
        </form>

        <!-- TEMPORARY: demo credentials for UI testing -->
        <div class="mt-12 pt-8 border-t border-rule">
          <p class="text-[10px] uppercase tracking-[0.1em] text-muted mb-3 font-medium">Demo accounts</p>
          <div class="grid grid-cols-2 gap-2 text-[12px]">
            <button type="button" data-demo="admin" class="text-left border border-rule rounded-sm px-3 py-2.5 hover:border-ink/30 hover:bg-rule/20 transition-colors duration-150">
              <span class="block font-medium text-ink">admin</span>
              <span class="text-muted text-[11px]">Administrator</span>
            </button>
            <button type="button" data-demo="hr" class="text-left border border-rule rounded-sm px-3 py-2.5 hover:border-ink/30 hover:bg-rule/20 transition-colors duration-150">
              <span class="block font-medium text-ink">hr</span>
              <span class="text-muted text-[11px]">HR</span>
            </button>
            <button type="button" data-demo="manager" class="text-left border border-rule rounded-sm px-3 py-2.5 hover:border-ink/30 hover:bg-rule/20 transition-colors duration-150">
              <span class="block font-medium text-ink">manager</span>
              <span class="text-muted text-[11px]">Manager</span>
            </button>
            <button type="button" data-demo="employee" class="text-left border border-rule rounded-sm px-3 py-2.5 hover:border-ink/30 hover:bg-rule/20 transition-colors duration-150">
              <span class="block font-medium text-ink">employee</span>
              <span class="text-muted text-[11px]">Employee</span>
            </button>
          </div>
          <p class="mt-3 text-[11px] text-muted/70">Password matches the username. For UI testing only.</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { login } from '../js/api.js';
    import { loadSession, isAuthed, role, tryDemoLogin } from '../js/auth.js';

    const roleMap = {
      Employee: '/pages/employee-dashboard.html',
      Manager: '/pages/manager-dashboard.html',
      HR: '/pages/hr-dashboard.html',
      Administrator: '/pages/admin-dashboard.html',
    };

    await loadSession();
    if (isAuthed()) {
      window.location.replace(roleMap[role()] || '/pages/login.html');
    }

    const form = document.getElementById('login-form');
    const errEl = document.getElementById('login-error');
    const btn = document.getElementById('login-submit');

    document.querySelectorAll('[data-demo]').forEach((el) => {
      el.addEventListener('click', () => {
        const u = el.getAttribute('data-demo');
        form.email.value = u;
        form.password.value = u;
        form.requestSubmit();
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const email = form.email.value.trim();
      const password = form.password.value;

      try {
        await login(email, password);
        await loadSession();
        window.location.href = roleMap[role()] || '/pages/employee-dashboard.html';
      } catch {
        const demoUser = tryDemoLogin(email, password);
        if (demoUser) {
          window.location.href = roleMap[demoUser.role] || '/pages/employee-dashboard.html';
          return;
        }
        errEl.textContent = 'Unable to reach the authentication service.';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
