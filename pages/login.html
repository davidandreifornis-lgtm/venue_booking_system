<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Venue Booking</h1>
      <p class="subtitle">Sign in with your company account</p>

      <form id="login-form" novalidate>
        <div id="login-error" class="alert-error" hidden></div>

        <div style="margin-bottom:14px">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="text" id="email" name="email" required autocomplete="username" placeholder="you@company.com" />
        </div>
        <div style="margin-bottom:18px">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" id="login-submit" class="btn btn-dark" style="width:100%;height:42px">Sign in</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { login } from '../js/api.js';
    import { loadSession, isAuthed, role, setSession } from '../js/auth.js';

    const roleMap = {
      Employee: 'employee-dashboard.html',
      Manager: 'manager-dashboard.html',
      HR: 'hr-dashboard.html',
      Administrator: 'admin-dashboard.html',
    };

    await loadSession();
    if (isAuthed()) {
      window.location.replace(roleMap[role()] || 'employee-dashboard.html');
    }

    const form = document.getElementById('login-form');
    const errEl = document.getElementById('login-error');
    const btn = document.getElementById('login-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const email = form.email.value.trim();
      const password = form.password.value;

      try {
        const user = await login(email, password);
        setSession(user);
        window.location.href = roleMap[user?.role] || 'employee-dashboard.html';
      } catch (err) {
        errEl.textContent = err?.message || 'Invalid email or password.';
        errEl.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
