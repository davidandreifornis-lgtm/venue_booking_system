<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Logs — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Inter Tight"', 'system-ui', 'sans-serif'],
          },
          colors: {
            paper: '#faf8f5',
            ink: '#1a1815',
            muted: '#6b6560',
            rule: '#e8e4dd',
            accent: '#3d6b66',
            'accent-soft': '#e6efee',
            clay: '#b5623f',
          },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: {
            card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)',
          },
        },
      },
    };
  </script>
  <style>
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url('../assets/noise.svg');
      background-repeat: repeat;
    }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="Activity Logs">
  <div id="app">
    <div class="flex flex-wrap gap-2 mb-6" id="log-filters">
      <button type="button" data-cat="" class="filter-chip px-3 py-1 text-xs uppercase tracking-[0.06em] border border-ink bg-ink text-paper rounded-sm">All</button>
      <button type="button" data-cat="Bookings" class="filter-chip px-3 py-1 text-xs uppercase tracking-[0.06em] border border-rule text-muted rounded-sm hover:border-ink hover:text-ink">Bookings</button>
      <button type="button" data-cat="Users" class="filter-chip px-3 py-1 text-xs uppercase tracking-[0.06em] border border-rule text-muted rounded-sm hover:border-ink hover:text-ink">Users</button>
      <button type="button" data-cat="Venues" class="filter-chip px-3 py-1 text-xs uppercase tracking-[0.06em] border border-rule text-muted rounded-sm hover:border-ink hover:text-ink">Venues</button>
      <button type="button" data-cat="Departments" class="filter-chip px-3 py-1 text-xs uppercase tracking-[0.06em] border border-rule text-muted rounded-sm hover:border-ink hover:text-ink">Departments</button>
    </div>
    <div id="logs-table"></div>
  </div>

  <script type="module">
    import '../js/app.js';
    import { getActivityLogs } from '../js/api.js';
    import { dataTable } from '../components/data-table.js';
    import { formatDateTime } from '../js/utils.js';
    import { toast } from '../components/toast.js';

    async function load(category) {
      const el = document.getElementById('logs-table');
      try {
        const params = category ? { category } : {};
        const data = await getActivityLogs(params);
        const list = Array.isArray(data) ? data : data?.items || [];
        dataTable({
          container: el,
          columns: [
            { key: 'timestamp', label: 'Timestamp', render: (r) => formatDateTime(r.timestamp) },
            { key: 'actor', label: 'Actor', render: (r) => r.actor || '—' },
            { key: 'action', label: 'Action', render: (r) => r.action || '—' },
            { key: 'target', label: 'Target', render: (r) => r.target || '—' },
            { key: 'details', label: 'Details', render: (r) => r.details || '—', sortable: false },
          ],
          rows: list,
          empty: { title: 'No activity recorded.' },
        });
      } catch {
        dataTable({
          container: el,
          columns: [],
          rows: [],
          empty: { title: 'No activity recorded.' },
        });
        toast('Unable to load activity logs. Backend not connected yet.', 'error');
      }
    }

    window.__pageInit = async function () {
      document.querySelectorAll('.filter-chip').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-chip').forEach((b) => {
            b.classList.remove('border-ink', 'bg-ink', 'text-paper');
            b.classList.add('border-rule', 'text-muted');
          });
          btn.classList.add('border-ink', 'bg-ink', 'text-paper');
          btn.classList.remove('border-rule', 'text-muted');
          load(btn.getAttribute('data-cat') || '');
        });
      });
      await load('');
    };
  </script>
</body>
</html>
