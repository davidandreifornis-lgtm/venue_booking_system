<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Venue Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Inter Tight"', 'system-ui', 'sans-serif'],
          },
          colors: {
            paper: '#faf8f5',
            ink: '#1a1815',
            muted: '#6b6560',
            rule: '#e8e4dd',
            accent: '#3d6b66',
            'accent-soft': '#e6efee',
            clay: '#b5623f',
          },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: {
            card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)',
          },
        },
      },
    };
  </script>
  <style>
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url('/assets/noise.svg');
      background-repeat: repeat;
    }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="Settings">
  <div id="app">
    <div class="max-w-lg">
      <section class="mb-10">
        <h2 class="font-display text-xl font-medium tracking-[-0.02em] mb-1">Profile</h2>
        <p class="text-sm text-muted mb-5">Your account details are managed by the authentication service.</p>
        <dl class="border border-rule rounded-sm divide-y divide-rule">
          <div class="px-4 py-3 flex justify-between gap-4">
            <dt class="text-[11px] uppercase tracking-[0.08em] text-muted">Name</dt>
            <dd class="text-sm text-ink" id="set-name">—</dd>
          </div>
          <div class="px-4 py-3 flex justify-between gap-4">
            <dt class="text-[11px] uppercase tracking-[0.08em] text-muted">Email</dt>
            <dd class="text-sm text-ink" id="set-email">—</dd>
          </div>
          <div class="px-4 py-3 flex justify-between gap-4">
            <dt class="text-[11px] uppercase tracking-[0.08em] text-muted">Role</dt>
            <dd class="text-sm text-ink" id="set-role">—</dd>
          </div>
          <div class="px-4 py-3 flex justify-between gap-4">
            <dt class="text-[11px] uppercase tracking-[0.08em] text-muted">Department</dt>
            <dd class="text-sm text-ink" id="set-dept">—</dd>
          </div>
        </dl>
      </section>

      <section>
        <h2 class="font-display text-xl font-medium tracking-[-0.02em] mb-1">Session</h2>
        <p class="text-sm text-muted mb-5">Sign out of this device.</p>
        <button type="button" id="btn-logout" class="text-sm font-medium border border-rule px-4 py-2 rounded-sm hover:bg-rule/30 transition-colors duration-150">
          Sign out
        </button>
      </section>
    </div>
  </div>

  <script type="module">
    import '../js/app.js';
    import { session, logout } from '../js/auth.js';

    window.__pageInit = async function () {
      const s = session();
      document.getElementById('set-name').textContent = s?.name || '—';
      document.getElementById('set-email').textContent = s?.email || '—';
      document.getElementById('set-role').textContent = s?.role || '—';
      document.getElementById('set-dept').textContent = s?.department || s?.departmentName || '—';
      document.getElementById('btn-logout').addEventListener('click', () => logout());
    };
  </script>
</body>
</html>
