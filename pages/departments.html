<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Departments — Venue Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Inter Tight"', 'system-ui', 'sans-serif'],
          },
          colors: {
            paper: '#faf8f5',
            ink: '#1a1815',
            muted: '#6b6560',
            rule: '#e8e4dd',
            accent: '#3d6b66',
            'accent-soft': '#e6efee',
            clay: '#b5623f',
          },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: {
            card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)',
          },
        },
      },
    };
  </script>
  <style>
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url('/assets/noise.svg');
      background-repeat: repeat;
    }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="Departments">
  <div id="app">
    <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <p class="text-sm text-muted leading-relaxed max-w-2xl">Departments and assigned managers.</p>
      <button type="button" id="btn-add-dept" class="inline-flex items-center justify-center gap-2 rounded px-4 py-2.5 text-sm font-medium text-paper bg-ink hover:bg-ink/90 transition-colors duration-150 shrink-0">Add department</button>
    </div>
    <div id="depts-table"></div>
  </div>

  <script type="module">
    import '../js/app.js';
    import { getDepartments, createDepartment, updateDepartment } from '../js/api.js';
    import { dataTable } from '../components/data-table.js';
    import { formModal } from '../components/modal.js';
    import { toast } from '../components/toast.js';
    import { escapeHtml } from '../js/utils.js';

    async function load() {
      const el = document.getElementById('depts-table');
      try {
        const data = await getDepartments();
        const list = Array.isArray(data) ? data : data?.items || [];
        dataTable({
          container: el,
          columns: [
            { key: 'name', label: 'Department Name' },
            { key: 'manager', label: 'Assigned Manager', render: (r) => r.managerName || r.manager || '—' },
            { key: 'status', label: 'Status', render: (r) => r.status || 'Active' },
            {
              key: 'actions',
              label: 'Actions',
              sortable: false,
              render: (r) => `<button type="button" class="text-accent hover:underline text-sm btn-edit" data-id="${escapeHtml(r.id)}">Edit</button>`,
            },
          ],
          rows: list,
          empty: { title: 'No departments found.' },
        });

        el.querySelectorAll('.btn-edit').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openEdit(list.find((d) => String(d.id) === btn.dataset.id));
          });
        });
      } catch {
        dataTable({ container: el, columns: [], rows: [], empty: { title: 'No departments found.' } });
        toast('Unable to load departments. Backend not connected yet.', 'error');
      }
    }

    async function openEdit(dept) {
      const isNew = !dept;
      const data = await formModal({
        title: isNew ? 'Add department' : 'Edit department',
        submitLabel: isNew ? 'Create' : 'Save',
        bodyHtml: `
          <div class="space-y-3">
            <div>
              <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1">Department name</label>
              <input name="name" value="${escapeHtml(dept?.name || '')}" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required />
            </div>
            <div>
              <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1">Manager name or ID</label>
              <input name="managerId" value="${escapeHtml(dept?.managerId || dept?.managerName || '')}" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" />
            </div>
          </div>
        `,
      });
      if (!data) return;
      try {
        if (isNew) await createDepartment(data);
        else await updateDepartment(dept.id, data);
      } catch {
        toast('Backend not connected yet. Request not sent.', 'error');
      }
    }

    window.__pageInit = async function () {
      document.getElementById('btn-add-dept').addEventListener('click', () => openEdit(null));
      await load();
    };
  </script>
</body>
</html>
