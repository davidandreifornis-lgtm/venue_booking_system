<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Dashboard — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-page-title="HR Dashboard">
  <div id="app">
    <div class="stat-grid">
      <div class="stat-card"><p class="label">Awaiting decision</p><p class="value" id="card-awaiting">0</p><p class="hint">Ready for HR</p></div>
      <div class="stat-card"><p class="label">Today</p><p class="value" id="card-today">0</p><p class="hint">Bookings today</p></div>
      <div class="stat-card"><p class="label">This week</p><p class="value" id="card-week">0</p><p class="hint">Confirmed</p></div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="card-header-row">
          <h2>Pending decisions</h2>
          <a href="pending-requests.html" class="btn btn-outline btn-sm">View all</a>
        </div>
        <div id="pending-list"></div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../js/app.js';
    import { getBookings } from '../js/api.js';
    import { emptyState } from '../components/empty-state.js';
    import { statusBadge } from '../components/status-badge.js';
    import { formatDate } from '../js/utils.js';

    window.__pageInit = async function () {
      const el = document.getElementById('pending-list');
      try {
        const data = await getBookings({ status: 'Pending HR Decision' });
        const list = Array.isArray(data) ? data : data?.items || [];
        document.getElementById('card-awaiting').textContent = String(list.length);
        if (!list.length) {
          el.innerHTML = emptyState({ title: 'No pending requests.', hint: 'Manager-validated requests will appear here.' });
        } else {
          el.innerHTML = `<div class="table-responsive"><table class="table"><thead><tr>
            <th>Requester</th><th>Venue</th><th>Date</th><th>Status</th><th></th>
          </tr></thead><tbody>
            ${list.map((b) => `<tr>
              <td>${b.requesterName || '—'}</td>
              <td>${b.venueName || '—'}</td>
              <td>${formatDate(b.date)}</td>
              <td>${statusBadge(b.status)}</td>
              <td><a class="btn btn-primary btn-sm" href="booking-details.html?id=${encodeURIComponent(b.id)}">Review</a></td>
            </tr>`).join('')}
          </tbody></table></div>`;
        }
      } catch {
        el.innerHTML = emptyState({ title: 'No pending requests.', hint: 'Manager-validated requests will appear here.' });
      }
    };
  </script>
</body>
</html>
