<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Dashboard — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-page-title="HR Dashboard">
  <div id="app">
    <div class="stat-grid">
      <div class="stat-card"><p class="label">Awaiting decision</p><p class="value" id="card-awaiting">0</p><p class="hint">Ready for HR</p></div>
      <div class="stat-card"><p class="label">Expired</p><p class="value" id="card-expired">0</p><p class="hint">Past event, undecided</p></div>
      <div class="stat-card"><p class="label">Today</p><p class="value" id="card-today">0</p><p class="hint">Bookings today</p></div>
      <div class="stat-card"><p class="label">This week</p><p class="value" id="card-week">0</p><p class="hint">Confirmed</p></div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="card-header-row">
          <h2>Pending decisions</h2>
          <a href="pending-requests.html" class="btn btn-outline btn-sm">View all</a>
        </div>
        <div id="pending-list"></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-body">
        <div class="card-header-row">
          <h2>Expired bookings</h2>
          <a href="all-bookings.html" class="btn btn-outline btn-sm" id="link-expired-all">View in All Bookings</a>
        </div>
        <p class="text-sm text-muted" style="margin:0 0 12px">Requests that were still undecided when the event date passed. They were never approved; the slot was freed.</p>
        <div id="expired-list"></div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../js/app.js';
    import { getBookings } from '../js/api.js';
    import { emptyState } from '../components/empty-state.js';
    import { statusBadge } from '../components/status-badge.js';
    import { formatDate } from '../js/utils.js';

    function renderTable(list, emptyTitle, emptyHint) {
      if (!list.length) {
        return emptyState({ title: emptyTitle, hint: emptyHint });
      }
      return `<div class="table-responsive"><table class="table"><thead><tr>
        <th>Reference</th><th>Requester</th><th>Venue</th><th>Date</th><th>Status</th><th></th>
      </tr></thead><tbody>
        ${list.map((b) => `<tr>
          <td>${b.ref || b.id || '—'}</td>
          <td>${b.requesterName || '—'}</td>
          <td>${b.venueName || '—'}</td>
          <td>${formatDate(b.date)}</td>
          <td>${statusBadge(b)}</td>
          <td><a class="btn btn-primary btn-sm" href="booking-details.html?id=${encodeURIComponent(b.id)}">Open</a></td>
        </tr>`).join('')}
      </tbody></table></div>`;
    }

    window.__pageInit = async function () {
      const pendingEl = document.getElementById('pending-list');
      const expiredEl = document.getElementById('expired-list');
      try {
        const [pendingData, expiredData, approvedData] = await Promise.all([
          getBookings({ status: 'Pending HR Decision' }),
          getBookings({ status: 'Expired' }),
          getBookings({ status: 'Approved' }),
        ]);
        const pending = Array.isArray(pendingData) ? pendingData : pendingData?.items || [];
        const expired = Array.isArray(expiredData) ? expiredData : expiredData?.items || [];
        const approved = Array.isArray(approvedData) ? approvedData : approvedData?.items || [];

        document.getElementById('card-awaiting').textContent = String(pending.length);
        document.getElementById('card-expired').textContent = String(expired.length);

        const today = new Date().toISOString().slice(0, 10);
        const todayCount = approved.filter((b) => String(b.date || '').slice(0, 10) === today).length;
        document.getElementById('card-today').textContent = String(todayCount);

        // Simple "this week" count of approved
        const now = new Date();
        const startOfWeek = new Date(now);
        startOfWeek.setDate(now.getDate() - now.getDay());
        startOfWeek.setHours(0, 0, 0, 0);
        const weekCount = approved.filter((b) => {
          const d = new Date(String(b.date || '').slice(0, 10) + 'T00:00:00');
          return d >= startOfWeek && d <= now;
        }).length;
        document.getElementById('card-week').textContent = String(weekCount);

        pendingEl.innerHTML = renderTable(
          pending,
          'No pending requests.',
          'Manager-validated requests will appear here.'
        );
        expiredEl.innerHTML = renderTable(
          expired.slice(0, 25),
          'No expired bookings.',
          'Undecided requests whose event date has passed will appear here.'
        );
      } catch {
        pendingEl.innerHTML = emptyState({ title: 'No pending requests.', hint: 'Manager-validated requests will appear here.' });
        expiredEl.innerHTML = emptyState({ title: 'No expired bookings.', hint: 'Unable to load expired list.' });
      }
    };
  </script>
</body>
</html>
