<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Inter Tight"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="bg-paper text-ink font-sans">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main-area">
      <header id="header" class="top-header"></header>
      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Reports</h1>
            <p class="page-sub">Utilization, peak hours and approval turnaround</p>
          </div>
          <div class="flex gap-2 items-end flex-wrap">
            <label class="text-sm">From <input type="date" id="from" class="input" /></label>
            <label class="text-sm">To <input type="date" id="to" class="input" /></label>
            <button id="refresh" class="btn btn-primary">Refresh</button>
            <a id="ical" class="btn btn-ghost" href="#">Download iCal</a>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="card p-4">
            <div class="text-sm text-muted">Avg approval time</div>
            <div id="turnaround" class="text-2xl font-display font-semibold mt-1">—</div>
            <div id="turnaround-sample" class="text-xs text-muted mt-1"></div>
          </div>
          <div class="card p-4 md:col-span-2">
            <div class="text-sm text-muted mb-2">Status mix</div>
            <div id="status-mix" class="flex flex-wrap gap-2"></div>
          </div>
        </div>

        <div class="card p-4 mb-6">
          <h2 class="font-display text-lg mb-3">Peak booking hours</h2>
          <div id="peak-hours" class="flex items-end gap-1 h-40"></div>
        </div>

        <div class="card p-4">
          <h2 class="font-display text-lg mb-3">Utilization by venue / department</h2>
          <div class="table-wrap overflow-x-auto">
            <table class="data-table w-full text-sm">
              <thead>
                <tr>
                  <th>Venue</th>
                  <th>Department</th>
                  <th>Bookings</th>
                  <th>Hours</th>
                  <th>Avg attendees</th>
                </tr>
              </thead>
              <tbody id="util-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { loadSession, isAuthed, role } from '../js/auth.js';
    import { renderSidebar } from '../components/sidebar.js';
    import { renderHeader } from '../components/header.js';
    import { api } from '../js/api.js';
    import { showToast } from '../components/toast.js';

    await loadSession();
    if (!isAuthed()) location.replace('login.html');
    const r = role();
    if (r !== 'HR' && r !== 'Administrator') {
      location.replace('employee-dashboard.html');
    }

    renderSidebar(document.getElementById('sidebar'));
    renderHeader(document.getElementById('header'), { title: 'Reports' });

    const fromEl = document.getElementById('from');
    const toEl = document.getElementById('to');
    const now = new Date();
    fromEl.value = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
    toEl.value = now.toISOString().slice(0, 10);

    function qs() {
      return `from=${encodeURIComponent(fromEl.value)}&to=${encodeURIComponent(toEl.value)}`;
    }

    async function load() {
      try {
        const [util, peak, turn, status] = await Promise.all([
          api.get(`/reports/utilization?${qs()}`),
          api.get(`/reports/peak-hours?${qs()}`),
          api.get(`/reports/turnaround?${qs()}`),
          api.get(`/reports/status-summary?${qs()}`),
        ]);

        document.getElementById('turnaround').textContent =
          turn.avgHours != null ? `${turn.avgHours} h` : '—';
        document.getElementById('turnaround-sample').textContent =
          turn.sampleSize ? `Based on ${turn.sampleSize} bookings` : 'No data in range';

        const mix = document.getElementById('status-mix');
        mix.innerHTML = (status.statuses || []).map(s =>
          `<span class="badge">${s.status}: ${s.count}</span>`
        ).join('') || '<span class="text-muted text-sm">No bookings</span>';

        const max = Math.max(1, ...peak.hours.map(h => h.count));
        document.getElementById('peak-hours').innerHTML = peak.hours
          .filter(h => h.hour >= 6 && h.hour <= 20)
          .map(h => {
            const pct = Math.round((h.count / max) * 100);
            return `<div class="flex-1 flex flex-col items-center gap-1" title="${h.label}: ${h.count}">
              <div class="w-full bg-rule rounded-t" style="height:${Math.max(4, pct)}%"></div>
              <span class="text-[10px] text-muted">${h.hour}</span>
            </div>`;
          }).join('');

        const tbody = document.getElementById('util-body');
        tbody.innerHTML = (util.rows || []).map(row => `
          <tr>
            <td>${row.venueName || '—'}</td>
            <td>${row.departmentName || '—'}</td>
            <td>${row.bookingCount}</td>
            <td>${row.totalHours}</td>
            <td>${row.avgAttendees}</td>
          </tr>
        `).join('') || '<tr><td colspan="5" class="text-muted">No data in range</td></tr>';

        document.getElementById('ical').href =
          `../backend/api/index.php?r=/calendar/ical&from=${fromEl.value}&to=${toEl.value}`;
      } catch (err) {
        showToast(err.message || 'Failed to load reports', 'error');
      }
    }

    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
