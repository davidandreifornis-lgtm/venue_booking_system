<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Venue Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Inter Tight"', 'system-ui', 'sans-serif'],
          },
          colors: {
            paper: '#faf8f5',
            ink: '#1a1815',
            muted: '#6b6560',
            rule: '#e8e4dd',
            accent: '#3d6b66',
            'accent-soft': '#e6efee',
            clay: '#b5623f',
          },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: {
            card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)',
          },
        },
      },
    };
  </script>
  <style>
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url('/assets/noise.svg');
      background-repeat: repeat;
    }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="Admin Dashboard" data-page-subtitle="System overview">
  <div id="app">
    <div class="mb-8 sm:mb-10 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
      <div>
        <p class="text-[11px] uppercase tracking-[0.12em] text-muted mb-2">Overview</p>
        <p class="text-[15px] text-muted max-w-lg leading-relaxed">Users, departments, venues, and system activity at a glance.</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <a href="/pages/users.html" class="text-[12px] font-medium border border-rule px-3 py-2 rounded-sm hover:bg-rule/30 transition-colors duration-150">Users</a>
        <a href="/pages/venues.html" class="text-[12px] font-medium border border-rule px-3 py-2 rounded-sm hover:bg-rule/30 transition-colors duration-150">Venues</a>
        <a href="/pages/departments.html" class="text-[12px] font-medium border border-rule px-3 py-2 rounded-sm hover:bg-rule/30 transition-colors duration-150">Departments</a>
      </div>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-12">
      <div class="border border-rule rounded-sm bg-paper p-5 shadow-card relative overflow-hidden">
        <div class="absolute left-0 top-0 bottom-0 w-[3px] bg-ink/30"></div>
        <p class="text-[10px] uppercase tracking-[0.12em] text-muted font-medium">Users</p>
        <p id="card-users" class="mt-3 font-display text-[2rem] font-medium tracking-[-0.04em] text-ink leading-none">0</p>
      </div>
      <div class="border border-rule rounded-sm bg-paper p-5 shadow-card relative overflow-hidden">
        <div class="absolute left-0 top-0 bottom-0 w-[3px] bg-ink/30"></div>
        <p class="text-[10px] uppercase tracking-[0.12em] text-muted font-medium">Departments</p>
        <p id="card-depts" class="mt-3 font-display text-[2rem] font-medium tracking-[-0.04em] text-ink leading-none">0</p>
      </div>
      <div class="border border-rule rounded-sm bg-paper p-5 shadow-card relative overflow-hidden">
        <div class="absolute left-0 top-0 bottom-0 w-[3px] bg-accent"></div>
        <p class="text-[10px] uppercase tracking-[0.12em] text-muted font-medium">Venues</p>
        <p id="card-venues" class="mt-3 font-display text-[2rem] font-medium tracking-[-0.04em] text-ink leading-none">0</p>
      </div>
      <div class="border border-rule rounded-sm bg-paper p-5 shadow-card relative overflow-hidden">
        <div class="absolute left-0 top-0 bottom-0 w-[3px] bg-accent"></div>
        <p class="text-[10px] uppercase tracking-[0.12em] text-muted font-medium">Active bookings</p>
        <p id="card-bookings" class="mt-3 font-display text-[2rem] font-medium tracking-[-0.04em] text-ink leading-none">0</p>
      </div>
    </div>

    <section>
      <div class="flex items-baseline justify-between gap-4 mb-5 pb-3 border-b border-rule">
        <h2 class="font-display text-lg sm:text-xl font-medium tracking-[-0.025em]">Recent system activity</h2>
        <a href="/pages/activity-logs.html" class="text-[12px] text-accent hover:text-accent/80 tracking-wide font-medium transition-colors duration-150 shrink-0">View all</a>
      </div>
      <div id="activity-list"></div>
    </section>
  </div>

  <script type="module">
    import '../js/app.js';
    import { getUsers, getDepartments, getVenues, getBookings, getActivityLogs } from '../js/api.js';
    import { emptyState } from '../components/empty-state.js';

    window.__pageInit = async function () {
      const activityEl = document.getElementById('activity-list');

      async function safeCount(fn) {
        try {
          const data = await fn();
          const list = Array.isArray(data) ? data : data?.items || [];
          return list.length;
        } catch {
          return 0;
        }
      }

      document.getElementById('card-users').textContent = String(await safeCount(() => getUsers()));
      document.getElementById('card-depts').textContent = String(await safeCount(() => getDepartments()));
      document.getElementById('card-venues').textContent = String(await safeCount(() => getVenues()));
      document.getElementById('card-bookings').textContent = String(
        await safeCount(() => getBookings({ status: 'Approved' }))
      );

      try {
        const logs = await getActivityLogs({ limit: 10 });
        const list = Array.isArray(logs) ? logs : logs?.items || [];
        if (!list.length) {
          activityEl.innerHTML = emptyState({ title: 'No activity recorded.' });
        } else {
          activityEl.innerHTML = list
            .map(
              (l) => `
            <div class="border-b border-rule py-3.5 flex flex-wrap gap-x-4 gap-y-1 text-[13px]">
              <span class="text-muted text-[11px] whitespace-nowrap tracking-wide">${l.timestamp || '—'}</span>
              <span class="font-medium text-ink">${l.actor || '—'}</span>
              <span class="text-muted">${l.action || ''}</span>
              <span class="text-muted truncate">${l.target || ''}</span>
            </div>`
            )
            .join('');
        }
      } catch {
        activityEl.innerHTML = emptyState({ title: 'No activity recorded.' });
      }
    };
  </script>
</body>
</html>
