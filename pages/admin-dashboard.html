<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Venue Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['Fraunces', 'Georgia', 'serif'], sans: ['"Inter Tight"', 'system-ui', 'sans-serif'] },
          colors: { paper: '#faf8f5', ink: '#1a1815', muted: '#6b6560', rule: '#e8e4dd', accent: '#3d6b66', 'accent-soft': '#e6efee', clay: '#b5623f' },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: { card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)' },
        },
      },
    };
  </script>
  <style>body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.03;background-image:url('/assets/noise.svg');background-repeat:repeat}</style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="Admin Dashboard">
  <div id="app">
    <div id="page-header"></div>
    <div id="stat-grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4 mb-10"></div>
    <section class="mb-10">
      <div id="sec-act-h"></div>
      <div id="activity-list"></div>
    </section>
  </div>
  <script type="module">
    import '../js/app.js';
    import { getUsers, getDepartments, getVenues, getBookings, getActivityLogs } from '../js/api.js';
    import { ui, pageHeader, statCard, sectionHeader } from '../js/ui.js';
    import { emptyState } from '../components/empty-state.js';

    window.__pageInit = async function () {
      document.getElementById('page-header').innerHTML = pageHeader({
        description: 'Users, departments, venues, and system activity at a glance.',
        actionsHtml: `
          <a href="/pages/users.html" class="${ui.btnSecondary}">Users</a>
          <a href="/pages/venues.html" class="${ui.btnSecondary}">Venues</a>
          <a href="/pages/departments.html" class="${ui.btnSecondary}">Departments</a>
        `,
      });
      document.getElementById('stat-grid').innerHTML = [
        statCard({ label: 'Total users', valueId: 'card-users', accent: 'ink' }),
        statCard({ label: 'Departments', valueId: 'card-depts', accent: 'ink' }),
        statCard({ label: 'Venues', valueId: 'card-venues', accent: 'accent' }),
        statCard({ label: 'Active bookings', valueId: 'card-bookings', accent: 'accent' }),
      ].join('');
      document.getElementById('sec-act-h').innerHTML = sectionHeader({ title: 'Recent system activity', href: '/pages/activity-logs.html' });

      async function safeCount(fn) {
        try {
          const data = await fn();
          const list = Array.isArray(data) ? data : data?.items || [];
          return list.length;
        } catch { return 0; }
      }

      document.getElementById('card-users').textContent = String(await safeCount(() => getUsers()));
      document.getElementById('card-depts').textContent = String(await safeCount(() => getDepartments()));
      document.getElementById('card-venues').textContent = String(await safeCount(() => getVenues()));
      document.getElementById('card-bookings').textContent = String(await safeCount(() => getBookings({ status: 'Approved' })));

      const activityEl = document.getElementById('activity-list');
      try {
        const logs = await getActivityLogs({ limit: 10 });
        const list = Array.isArray(logs) ? logs : logs?.items || [];
        if (!list.length) {
          activityEl.innerHTML = emptyState({ title: 'No activity recorded.' });
        } else {
          activityEl.innerHTML = `<div class="${ui.panel} divide-y divide-rule">${list.map((l) => `
            <div class="px-4 sm:px-5 py-3.5 flex flex-wrap gap-x-4 gap-y-1 text-sm">
              <span class="text-xs text-muted whitespace-nowrap">${l.timestamp || '—'}</span>
              <span class="font-medium text-ink">${l.actor || '—'}</span>
              <span class="text-muted">${l.action || ''}</span>
              <span class="text-muted truncate">${l.target || ''}</span>
            </div>`).join('')}</div>`;
        }
      } catch {
        activityEl.innerHTML = emptyState({ title: 'No activity recorded.' });
      }
    };
  </script>
</body>
</html>
