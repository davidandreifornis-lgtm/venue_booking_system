<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-page-title="Admin Dashboard">
  <div id="app">
    <div class="stat-grid">
      <div class="stat-card"><p class="label">Users</p><p class="value" id="card-users">0</p></div>
      <div class="stat-card"><p class="label">Departments</p><p class="value" id="card-depts">0</p></div>
      <div class="stat-card"><p class="label">Venues</p><p class="value" id="card-venues">0</p></div>
      <div class="stat-card"><p class="label">Active bookings</p><p class="value" id="card-bookings">0</p></div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="card-header-row">
          <h2>Quick actions</h2>
          <div class="toolbar">
            <a href="users.html" class="btn btn-outline btn-sm">Users</a>
            <a href="venues.html" class="btn btn-outline btn-sm">Venues</a>
            <a href="departments.html" class="btn btn-outline btn-sm">Departments</a>
          </div>
        </div>
        <p style="margin:0;color:#6c757d;font-size:0.9rem">Manage system configuration and review activity.</p>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-body">
        <div class="card-header-row">
          <h2>Recent system activity</h2>
          <a href="activity-logs.html" class="btn btn-outline btn-sm">View all</a>
        </div>
        <div id="activity-list"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import '../js/app.js';
    import { getUsers, getDepartments, getVenues, getBookings, getActivityLogs } from '../js/api.js';
    import { emptyState } from '../components/empty-state.js';

    async function safeCount(fn) {
      try {
        const data = await fn();
        return (Array.isArray(data) ? data : data?.items || []).length;
      } catch { return 0; }
    }

    window.__pageInit = async function () {
      document.getElementById('card-users').textContent = String(await safeCount(() => getUsers()));
      document.getElementById('card-depts').textContent = String(await safeCount(() => getDepartments()));
      document.getElementById('card-venues').textContent = String(await safeCount(() => getVenues()));
      document.getElementById('card-bookings').textContent = String(await safeCount(() => getBookings({ status: 'Approved' })));

      const el = document.getElementById('activity-list');
      try {
        const logs = await getActivityLogs({ limit: 10 });
        const list = Array.isArray(logs) ? logs : logs?.items || [];
        if (!list.length) {
          el.innerHTML = emptyState({ title: 'No activity recorded.', hint: 'System events will appear here once the backend is connected.' });
        } else {
          el.innerHTML = `<div class="table-responsive"><table class="table"><thead><tr>
            <th>Timestamp</th><th>Actor</th><th>Action</th><th>Target</th>
          </tr></thead><tbody>
            ${list.map((l) => `<tr>
              <td>${l.timestamp || '—'}</td>
              <td>${l.actor || '—'}</td>
              <td>${l.action || '—'}</td>
              <td>${l.target || '—'}</td>
            </tr>`).join('')}
          </tbody></table></div>`;
        }
      } catch {
        el.innerHTML = emptyState({ title: 'No activity recorded.', hint: 'System events will appear here once the backend is connected.' });
      }
    };
  </script>
</body>
</html>
