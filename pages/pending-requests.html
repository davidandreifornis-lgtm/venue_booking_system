<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Requests — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['Fraunces', 'Georgia', 'serif'], sans: ['"Inter Tight"', 'system-ui', 'sans-serif'] },
          colors: { paper: '#faf8f5', ink: '#1a1815', muted: '#6b6560', rule: '#e8e4dd', accent: '#3d6b66', 'accent-soft': '#e6efee', clay: '#b5623f' },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: { card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)' },
        },
      },
    };
  </script>
  <style>body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.03;background-image:url('../assets/noise.svg');background-repeat:repeat}</style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="Pending Requests">
  <div id="app">
    <div id="page-header"></div>
    <div id="pending-table"></div>
  </div>
  <script type="module">
    import '../js/app.js';
    import { getBookings } from '../js/api.js';
    import { role } from '../js/auth.js';
    import { pageHeader } from '../js/ui.js';
    import { dataTable } from '../components/data-table.js';
    import { statusBadge } from '../components/status-badge.js';
    import { formatDate } from '../js/utils.js';
    import { toast } from '../components/toast.js';

    window.__pageInit = async function () {
      document.getElementById('page-header').innerHTML = pageHeader({
        description: 'Requests awaiting your review.',
      });
      const el = document.getElementById('pending-table');
      const r = role();
      const status = r === 'Manager' ? 'Pending Manager Validation' : r === 'HR' ? 'Pending HR Decision' : undefined;
      try {
        const data = await getBookings(status ? { status } : {});
        const list = Array.isArray(data) ? data : data?.items || [];
        dataTable({
          container: el,
          columns: [
            { key: 'ref', label: 'Reference', render: (row) => row.ref || row.id || '—' },
            { key: 'requester', label: 'Requester', render: (row) => row.requesterName || row.requester || '—' },
            { key: 'department', label: 'Department', render: (row) => row.department || '—' },
            { key: 'venue', label: 'Venue', render: (row) => row.venueName || row.venue || '—' },
            { key: 'date', label: 'Date', render: (row) => formatDate(row.date) },
            { key: 'status', label: 'Status', render: (row) => statusBadge(row.status), sortable: false },
          ],
          rows: list,
          empty: { title: 'No pending requests.' },
          onRowClick: (row) => { window.location.href = `/pages/booking-details.html?id=${encodeURIComponent(row.id)}`; },
        });
      } catch {
        dataTable({ container: el, columns: [], rows: [], empty: { title: 'No pending requests.' } });
        toast('Unable to load requests. Backend not connected yet.', 'error');
      }
    };
  </script>
</body>
</html>
