<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Venue Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Inter Tight"', 'system-ui', 'sans-serif'],
          },
          colors: {
            paper: '#faf8f5',
            ink: '#1a1815',
            muted: '#6b6560',
            rule: '#e8e4dd',
            accent: '#3d6b66',
            'accent-soft': '#e6efee',
            clay: '#b5623f',
          },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: {
            card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)',
          },
        },
      },
    };
  </script>
  <style>
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url('/assets/noise.svg');
      background-repeat: repeat;
    }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="Dashboard" data-page-subtitle="Your booking overview">
  <div id="app">
    <!-- Page intro -->
    <div class="mb-8 sm:mb-10 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
      <div>
        <p class="text-[11px] uppercase tracking-[0.12em] text-muted mb-2">Overview</p>
        <p class="text-[15px] text-muted max-w-md leading-relaxed">Track pending requests, approved bookings, and what is coming up next.</p>
      </div>
      <a href="/pages/booking-form.html"
         class="inline-flex items-center gap-2 self-start sm:self-auto bg-ink text-paper text-[13px] font-medium px-4 py-2.5 rounded-sm hover:bg-ink/90 transition-colors duration-150">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New request
      </a>
    </div>

    <!-- Summary cards -->
    <div id="summary-cards" class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-12">
      <div class="border border-rule rounded-sm bg-paper p-5 sm:p-6 shadow-card relative overflow-hidden">
        <div class="absolute left-0 top-0 bottom-0 w-[3px] bg-rule"></div>
        <p class="text-[10px] uppercase tracking-[0.12em] text-muted font-medium">Pending</p>
        <p id="card-pending" class="mt-3 font-display text-[2rem] font-medium tracking-[-0.04em] text-ink leading-none">0</p>
        <p class="mt-2 text-[12px] text-muted">Awaiting review</p>
      </div>
      <div class="border border-rule rounded-sm bg-paper p-5 sm:p-6 shadow-card relative overflow-hidden">
        <div class="absolute left-0 top-0 bottom-0 w-[3px] bg-accent"></div>
        <p class="text-[10px] uppercase tracking-[0.12em] text-muted font-medium">Approved</p>
        <p id="card-approved" class="mt-3 font-display text-[2rem] font-medium tracking-[-0.04em] text-ink leading-none">0</p>
        <p class="mt-2 text-[12px] text-muted">Confirmed bookings</p>
      </div>
      <div class="border border-rule rounded-sm bg-paper p-5 sm:p-6 shadow-card relative overflow-hidden">
        <div class="absolute left-0 top-0 bottom-0 w-[3px] bg-ink/20"></div>
        <p class="text-[10px] uppercase tracking-[0.12em] text-muted font-medium">Upcoming</p>
        <p id="card-upcoming" class="mt-3 font-display text-[2rem] font-medium tracking-[-0.04em] text-ink leading-none">0</p>
        <p class="mt-2 text-[12px] text-muted">Scheduled events</p>
      </div>
    </div>

    <!-- Recent Requests -->
    <section class="mb-14">
      <div class="flex items-baseline justify-between gap-4 mb-5 pb-3 border-b border-rule">
        <h2 class="font-display text-lg sm:text-xl font-medium tracking-[-0.025em]">Recent requests</h2>
        <a href="/pages/my-requests.html" class="text-[12px] text-accent hover:text-accent/80 tracking-wide font-medium transition-colors duration-150 shrink-0">View all</a>
      </div>
      <div id="recent-requests"></div>
    </section>

    <!-- Upcoming -->
    <section>
      <div class="flex items-baseline justify-between gap-4 mb-5 pb-3 border-b border-rule">
        <h2 class="font-display text-lg sm:text-xl font-medium tracking-[-0.025em]">Upcoming</h2>
        <a href="/pages/calendar.html" class="text-[12px] text-accent hover:text-accent/80 tracking-wide font-medium transition-colors duration-150 shrink-0">Calendar</a>
      </div>
      <div id="upcoming-list"></div>
    </section>
  </div>

  <script type="module">
    import '../js/app.js';
    import { getBookings } from '../js/api.js';
    import { dataTable } from '../components/data-table.js';
    import { emptyState } from '../components/empty-state.js';
    import { statusBadge } from '../components/status-badge.js';
    import { formatDate, formatTime } from '../js/utils.js';
    import { toast } from '../components/toast.js';

    window.__pageInit = async function () {
      const recentEl = document.getElementById('recent-requests');
      const upcomingEl = document.getElementById('upcoming-list');

      try {
        const bookings = await getBookings({ scope: 'mine' });
        const list = Array.isArray(bookings) ? bookings : bookings?.items || [];

        const pending = list.filter((b) =>
          ['Pending Manager Validation', 'Manager Validated', 'Pending HR Decision'].includes(b.status)
        ).length;
        const approved = list.filter((b) => b.status === 'Approved').length;
        const upcoming = list.filter((b) => b.status === 'Approved' || b.status === 'Rescheduled').length;

        document.getElementById('card-pending').textContent = String(pending);
        document.getElementById('card-approved').textContent = String(approved);
        document.getElementById('card-upcoming').textContent = String(upcoming);

        dataTable({
          container: recentEl,
          columns: [
            { key: 'ref', label: 'Reference', render: (r) => r.ref || r.id || '—' },
            { key: 'venue', label: 'Venue', render: (r) => r.venueName || r.venue || '—' },
            { key: 'date', label: 'Date', render: (r) => formatDate(r.date) },
            { key: 'status', label: 'Status', render: (r) => statusBadge(r.status), sortable: false },
          ],
          rows: list.slice(0, 8),
          empty: {
            title: 'No booking requests found.',
            hint: 'Submit a request to reserve a venue for your next event.',
            actionLabel: 'New request',
            actionHref: '/pages/booking-form.html',
          },
          onRowClick: (row) => {
            window.location.href = `/pages/booking-details.html?id=${encodeURIComponent(row.id)}`;
          },
        });

        const up = list.filter((b) => b.status === 'Approved' || b.status === 'Rescheduled');
        if (!up.length) {
          upcomingEl.innerHTML = emptyState({
            title: 'No upcoming bookings.',
            hint: 'Approved bookings will appear here once confirmed.',
          });
        } else {
          upcomingEl.innerHTML = `<div class="space-y-2">${up
            .map(
              (b) => `
            <a href="/pages/booking-details.html?id=${encodeURIComponent(b.id)}"
               class="block border border-rule rounded-sm p-4 hover:border-ink/20 hover:shadow-card transition-shadow duration-150 bg-paper">
              <div class="flex items-baseline justify-between gap-3">
                <p class="font-medium text-[13px] text-ink">${b.venueName || b.venue || 'Venue'}</p>
                <p class="text-[11px] text-muted shrink-0 tracking-wide">${formatDate(b.date)} · ${formatTime(b.startTime)}</p>
              </div>
              <p class="text-[12px] text-muted mt-1.5 truncate">${b.purpose || ''}</p>
            </a>`
            )
            .join('')}</div>`;
        }
      } catch (err) {
        recentEl.innerHTML = emptyState({
          title: 'No booking requests found.',
          hint: 'Submit a request to reserve a venue for your next event.',
          actionLabel: 'New request',
          actionHref: '/pages/booking-form.html',
        });
        upcomingEl.innerHTML = emptyState({
          title: 'No upcoming bookings.',
          hint: 'Approved bookings will appear here once confirmed.',
        });
      }
    };
  </script>
</body>
</html>
