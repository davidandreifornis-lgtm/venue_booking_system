<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-page-title="Dashboard">
  <div id="app">
    <div class="stat-grid" id="stat-grid">
      <div class="stat-card">
        <p class="label">Pending requests</p>
        <p class="value" id="card-pending">0</p>
        <p class="hint">Awaiting review</p>
      </div>
      <div class="stat-card">
        <p class="label">Approved bookings</p>
        <p class="value" id="card-approved">0</p>
        <p class="hint">Confirmed</p>
      </div>
      <div class="stat-card">
        <p class="label">Upcoming</p>
        <p class="value" id="card-upcoming">0</p>
        <p class="hint">Scheduled events</p>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="card-header-row">
          <h2>Recent requests</h2>
          <div class="toolbar">
            <a href="my-requests.html" class="btn btn-outline btn-sm">View all</a>
            <a href="booking-form.html" class="btn btn-primary btn-sm">+ New request</a>
          </div>
        </div>
        <div id="recent-requests"></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-body">
        <div class="card-header-row">
          <h2>Upcoming</h2>
          <a href="calendar.html" class="btn btn-outline btn-sm">Calendar</a>
        </div>
        <div id="upcoming-list"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import '../js/app.js';
    import { getBookings } from '../js/api.js';
    import { dataTable } from '../components/data-table.js';
    import { emptyState } from '../components/empty-state.js';
    import { statusBadge } from '../components/status-badge.js';
    import { formatDate, formatTime } from '../js/utils.js';

    window.__pageInit = async function () {
      const recentEl = document.getElementById('recent-requests');
      const upcomingEl = document.getElementById('upcoming-list');
      try {
        const data = await getBookings({ scope: 'mine' });
        const list = Array.isArray(data) ? data : data?.items || [];
        document.getElementById('card-pending').textContent = String(
          list.filter((b) => ['Pending Manager Validation', 'Manager Validated', 'Pending HR Decision'].includes(b.status)).length
        );
        document.getElementById('card-approved').textContent = String(list.filter((b) => b.status === 'Approved').length);
        document.getElementById('card-upcoming').textContent = String(
          list.filter((b) => b.status === 'Approved' || b.status === 'Rescheduled').length
        );
        dataTable({
          container: recentEl,
          columns: [
            { key: 'ref', label: 'Reference', render: (r) => r.ref || r.id || '—' },
            { key: 'venue', label: 'Venue', render: (r) => r.venueName || r.venue || '—' },
            { key: 'date', label: 'Date', render: (r) => formatDate(r.date) },
            { key: 'status', label: 'Status', render: (r) => statusBadge(r.status), sortable: false },
          ],
          rows: list.slice(0, 10),
          empty: {
            title: 'No booking requests found.',
            hint: 'Submit a request to reserve a venue for your next event.',
            actionLabel: 'New request',
            actionHref: 'booking-form.html',
          },
          onRowClick: (row) => { window.location.href = `booking-details.html?id=${encodeURIComponent(row.id)}`; },
        });
        const up = list.filter((b) => b.status === 'Approved' || b.status === 'Rescheduled');
        if (!up.length) {
          upcomingEl.innerHTML = emptyState({ title: 'No upcoming bookings.', hint: 'Approved bookings will appear here.' });
        } else {
          upcomingEl.innerHTML = `<div class="table-responsive"><table class="table"><thead><tr>
            <th>Venue</th><th>Date</th><th>Time</th><th>Purpose</th>
          </tr></thead><tbody>
            ${up.map((b) => `<tr class="clickable" onclick="location.href='booking-details.html?id=${encodeURIComponent(b.id)}'">
              <td>${b.venueName || b.venue || '—'}</td>
              <td>${formatDate(b.date)}</td>
              <td>${formatTime(b.startTime)}</td>
              <td>${b.purpose || '—'}</td>
            </tr>`).join('')}
          </tbody></table></div>`;
        }
      } catch {
        recentEl.innerHTML = emptyState({
          title: 'No booking requests found.',
          hint: 'Submit a request to reserve a venue for your next event.',
          actionLabel: 'New request',
          actionHref: 'booking-form.html',
        });
        upcomingEl.innerHTML = emptyState({ title: 'No upcoming bookings.', hint: 'Approved bookings will appear here.' });
      }
    };
  </script>
</body>
</html>
