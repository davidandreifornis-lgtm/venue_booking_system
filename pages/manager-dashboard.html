<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Dashboard — Venue Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['Fraunces', 'Georgia', 'serif'], sans: ['"Inter Tight"', 'system-ui', 'sans-serif'] },
          colors: { paper: '#faf8f5', ink: '#1a1815', muted: '#6b6560', rule: '#e8e4dd', accent: '#3d6b66', 'accent-soft': '#e6efee', clay: '#b5623f' },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: { card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)' },
        },
      },
    };
  </script>
  <style>body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.03;background-image:url('/assets/noise.svg');background-repeat:repeat}</style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="Manager Dashboard">
  <div id="app">
    <div id="page-header"></div>
    <div id="stat-grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 mb-10"></div>
    <section class="mb-10">
      <div id="sec-await-h"></div>
      <div id="awaiting-list"></div>
    </section>
    <section class="mb-10">
      <div id="sec-act-h"></div>
      <div id="activity-list"></div>
    </section>
  </div>
  <script type="module">
    import '../js/app.js';
    import { getBookings } from '../js/api.js';
    import { ui, pageHeader, statCard, sectionHeader } from '../js/ui.js';
    import { emptyState } from '../components/empty-state.js';
    import { statusBadge } from '../components/status-badge.js';
    import { formatDate } from '../js/utils.js';

    window.__pageInit = async function () {
      document.getElementById('page-header').innerHTML = pageHeader({
        description: 'Review and validate booking requests from your department before they reach HR.',
      });
      document.getElementById('stat-grid').innerHTML = [
        statCard({ label: 'Awaiting validation', valueId: 'card-awaiting', hint: 'Needs your review', accent: 'clay' }),
        statCard({ label: 'Validated this week', valueId: 'card-validated', hint: 'Sent to HR', accent: 'accent' }),
        statCard({ label: 'Department upcoming', valueId: 'card-upcoming', hint: 'Approved events', accent: 'ink' }),
      ].join('');
      document.getElementById('sec-await-h').innerHTML = sectionHeader({ title: 'Awaiting validation', href: '/pages/pending-requests.html' });
      document.getElementById('sec-act-h').innerHTML = sectionHeader({ title: 'Recent activity' });

      const awaitingEl = document.getElementById('awaiting-list');
      const activityEl = document.getElementById('activity-list');

      try {
        const data = await getBookings({ scope: 'department' });
        const list = Array.isArray(data) ? data : data?.items || [];
        const awaiting = list.filter((b) => b.status === 'Pending Manager Validation');
        document.getElementById('card-awaiting').textContent = String(awaiting.length);
        document.getElementById('card-validated').textContent = '0';
        document.getElementById('card-upcoming').textContent = String(list.filter((b) => b.status === 'Approved' || b.status === 'Rescheduled').length);

        if (!awaiting.length) {
          awaitingEl.innerHTML = emptyState({ title: 'No pending requests.', hint: 'Requests from your department will appear here when submitted.' });
        } else {
          awaitingEl.innerHTML = `<div class="space-y-2">${awaiting.map((b) => `
            <div class="${ui.card} p-4 flex flex-col sm:flex-row sm:items-center gap-3">
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-ink truncate">${b.requesterName || b.requester || '—'} · ${b.venueName || b.venue || '—'}</p>
                <p class="text-sm text-muted mt-1">${formatDate(b.date)} · ${b.purpose || ''}</p>
              </div>
              <div class="flex items-center gap-3 shrink-0">
                ${statusBadge(b.status)}
                <a href="/pages/booking-details.html?id=${encodeURIComponent(b.id)}" class="${ui.link}">Review</a>
              </div>
            </div>`).join('')}</div>`;
        }
        activityEl.innerHTML = emptyState({ title: 'No activity recorded.' });
      } catch {
        awaitingEl.innerHTML = emptyState({ title: 'No pending requests.', hint: 'Requests from your department will appear here when submitted.' });
        activityEl.innerHTML = emptyState({ title: 'No activity recorded.' });
      }
    };
  </script>
</body>
</html>
