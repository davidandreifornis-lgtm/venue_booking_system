<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Dashboard — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-page-title="Manager Dashboard">
  <div id="app">
    <div class="stat-grid">
      <div class="stat-card"><p class="label">Awaiting validation</p><p class="value" id="card-awaiting">0</p><p class="hint">Needs your review</p></div>
      <div class="stat-card"><p class="label">Validated this week</p><p class="value" id="card-validated">0</p><p class="hint">Sent to HR</p></div>
      <div class="stat-card"><p class="label">Department upcoming</p><p class="value" id="card-upcoming">0</p><p class="hint">Approved events</p></div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="card-header-row">
          <h2>Awaiting validation</h2>
          <a href="pending-requests.html" class="btn btn-outline btn-sm">View all</a>
        </div>
        <div id="awaiting-list"></div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../js/app.js';
    import { getBookings } from '../js/api.js';
    import { emptyState } from '../components/empty-state.js';
    import { statusBadge } from '../components/status-badge.js';
    import { formatDate } from '../js/utils.js';

    window.__pageInit = async function () {
      const el = document.getElementById('awaiting-list');
      try {
        const data = await getBookings({ scope: 'department' });
        const list = Array.isArray(data) ? data : data?.items || [];
        const awaiting = list.filter((b) => b.status === 'Pending Manager Validation');
        document.getElementById('card-awaiting').textContent = String(awaiting.length);
        document.getElementById('card-validated').textContent = '0';
        document.getElementById('card-upcoming').textContent = String(
          list.filter((b) => b.status === 'Approved' || b.status === 'Rescheduled').length
        );
        if (!awaiting.length) {
          el.innerHTML = emptyState({ title: 'No pending requests.', hint: 'Requests from your department will appear here.' });
        } else {
          el.innerHTML = `<div class="table-responsive"><table class="table"><thead><tr>
            <th>Requester</th><th>Venue</th><th>Date</th><th>Status</th><th></th>
          </tr></thead><tbody>
            ${awaiting.map((b) => `<tr>
              <td>${b.requesterName || b.requester || '—'}</td>
              <td>${b.venueName || b.venue || '—'}</td>
              <td>${formatDate(b.date)}</td>
              <td>${statusBadge(b.status)}</td>
              <td><a class="btn btn-primary btn-sm" href="booking-details.html?id=${encodeURIComponent(b.id)}">Review</a></td>
            </tr>`).join('')}
          </tbody></table></div>`;
        }
      } catch {
        el.innerHTML = emptyState({ title: 'No pending requests.', hint: 'Requests from your department will appear here.' });
      }
    };
  </script>
</body>
</html>
