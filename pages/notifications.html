<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Inter Tight"', 'system-ui', 'sans-serif'],
          },
          colors: {
            paper: '#faf8f5',
            ink: '#1a1815',
            muted: '#6b6560',
            rule: '#e8e4dd',
            accent: '#3d6b66',
            'accent-soft': '#e6efee',
            clay: '#b5623f',
          },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: {
            card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)',
          },
        },
      },
    };
  </script>
  <style>
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url('../assets/noise.svg');
      background-repeat: repeat;
    }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="Notifications">
  <div id="app">
    <div class="mb-8"><p class="text-sm text-muted leading-relaxed max-w-2xl">System and booking notifications.</p></div>
    <div id="notifications-list"></div>
  </div>

  <script type="module">
    import '../js/app.js';
    import { getNotifications, markNotificationRead } from '../js/api.js';
    import { emptyState } from '../components/empty-state.js';
    import { formatDateTime, escapeHtml } from '../js/utils.js';
    import { toast } from '../components/toast.js';

    window.__pageInit = async function () {
      const el = document.getElementById('notifications-list');
      try {
        const data = await getNotifications();
        const list = Array.isArray(data) ? data : data?.items || [];
        if (!list.length) {
          el.innerHTML = emptyState({ title: 'No notifications.' });
          return;
        }
        el.innerHTML = list
          .map(
            (n) => `
          <div class="flex items-start gap-3 border-b border-rule py-4 ${n.read ? 'opacity-60' : ''}" data-id="${escapeHtml(n.id)}">
            <div class="mt-1.5 w-2 h-2 rounded-full shrink-0 ${n.read ? 'bg-rule' : 'bg-accent'}"></div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-ink">${escapeHtml(n.title || n.message || 'Notification')}</p>
              <p class="text-xs text-muted mt-0.5">${formatDateTime(n.createdAt || n.timestamp)}</p>
              ${n.link ? `<a href="${escapeHtml(n.link)}" class="text-xs text-accent hover:underline mt-1 inline-block">View</a>` : ''}
            </div>
            ${!n.read ? `<button type="button" class="text-xs text-muted hover:text-ink btn-read" data-id="${escapeHtml(n.id)}">Mark read</button>` : ''}
          </div>`
          )
          .join('');

        el.querySelectorAll('.btn-read').forEach((btn) => {
          btn.addEventListener('click', async () => {
            try {
              await markNotificationRead(btn.dataset.id);
            } catch {
              toast('Backend not connected yet. Request not sent.', 'error');
            }
          });
        });
      } catch {
        el.innerHTML = emptyState({ title: 'No notifications.' });
        toast('Unable to load notifications. Backend not connected yet.', 'error');
      }
    };
  </script>
</body>
</html>
