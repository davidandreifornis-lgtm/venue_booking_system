<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Details — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Inter Tight"', 'system-ui', 'sans-serif'],
          },
          colors: {
            paper: '#faf8f5',
            ink: '#1a1815',
            muted: '#6b6560',
            rule: '#e8e4dd',
            accent: '#3d6b66',
            'accent-soft': '#e6efee',
            clay: '#b5623f',
          },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: {
            card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)',
          },
        },
      },
    };
  </script>
  <style>
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url('../assets/noise.svg');
      background-repeat: repeat;
    }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="Booking Details">
  <div id="app">
    <div id="detail-root">
      <div class="flex items-center justify-center py-20 text-muted text-sm">Loading…</div>
    </div>
  </div>

  <script type="module">
    import '../js/app.js';
    import { getBooking, validateBooking, approveBooking, declineBooking, rescheduleBooking, requestRevision, respondReschedule, resubmitBooking } from '../js/api.js';
    import { role, session } from '../js/auth.js';
    import { parseQuery, formatDate, formatTime, formatDateTime, escapeHtml } from '../js/utils.js';
    import { statusBadge } from '../components/status-badge.js';
    import { timeline } from '../components/timeline.js';
    import { emptyState } from '../components/empty-state.js';
    import { openModal, closeModal, confirm } from '../components/modal.js';
    import { toast } from '../components/toast.js';

    window.__pageInit = async function () {
      const { id } = parseQuery();
      const root = document.getElementById('detail-root');

      if (!id) {
        root.innerHTML = emptyState({ title: 'No booking requests found.', hint: 'Missing request id.' });
        return;
      }

      let booking;
      try {
        booking = await getBooking(id);
      } catch {
        root.innerHTML = emptyState({
          title: 'No booking requests found.',
          hint: 'Unable to load this request. Backend not connected yet.',
        });
        toast('Unable to load booking. Backend not connected yet.', 'error');
        return;
      }

      const r = role();
      const canManagerAct = r === 'Manager' && booking.status === 'Pending Manager Validation';
      const canHrAct = r === 'HR' && ['Pending HR Decision', 'Manager Validated'].includes(booking.status);

      const dl = (label, value) => `
        <div class="py-3 border-b border-rule">
          <dt class="text-[11px] uppercase tracking-[0.08em] text-muted">${escapeHtml(label)}</dt>
          <dd class="mt-1 text-sm text-ink">${value ?? '—'}</dd>
        </div>`;

      root.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8 lg:gap-12">
          <div class="lg:col-span-3">
            <div class="flex items-start justify-between gap-4 mb-6">
              <div>
                <p class="text-xs text-muted tracking-wide">${escapeHtml(booking.ref || booking.id || '')}</p>
                <h2 class="font-display text-2xl font-medium tracking-[-0.02em] mt-1">${escapeHtml(booking.purpose || 'Booking Request')}</h2>
              </div>
              <div>${statusBadge(booking)}</div>
            </div>

            <dl class="mb-10">
              ${dl('Requester', escapeHtml(booking.requesterName || booking.requester))}
              ${dl('Department', escapeHtml(booking.department))}
              ${dl('Department Manager', escapeHtml(booking.departmentManager || booking.managerName))}
              ${dl('Venue', escapeHtml(booking.venueName || booking.venue))}
              ${dl('Event Type', escapeHtml(booking.eventType))}
              ${dl('Date', formatDate(booking.date))}
              ${dl('Time', `${formatTime(booking.startTime)} – ${formatTime(booking.endTime)}`)}
              ${dl('Attendees', escapeHtml(String(booking.attendees ?? '—')))}
              ${dl('Requirements', (booking.requirements || []).map((r) => escapeHtml(r.name) + (r.quantity > 1 ? ' ×' + r.quantity : '')).join(', ') || '—')}
              ${dl('Other Notes', escapeHtml(booking.additionalRequirements || '—'))}
              ${dl('Manager Notes', escapeHtml(booking.managerNotes || '—'))}
              ${dl('HR Notes', escapeHtml(booking.hrNotes || '—'))}
              ${dl('Created', formatDateTime(booking.createdAt || booking.createdDate))}
              ${dl('Last Updated', formatDateTime(booking.updatedAt || booking.lastUpdatedDate))}
            </dl>

            ${canHrAct || canManagerAct ? `
              <div class="border border-rule rounded-sm p-5 mb-8">
                <p class="text-[11px] uppercase tracking-[0.08em] text-muted mb-4">Actions</p>
                <div class="flex flex-wrap gap-2" id="action-bar"></div>
              </div>
            ` : ''}
          </div>

          <div class="lg:col-span-2 lg:border-l lg:border-rule lg:pl-8">
            <h3 class="font-display text-lg font-medium tracking-[-0.02em] mb-6">Timeline</h3>
            <div id="timeline-root">${timeline(booking)}</div>
          </div>
        </div>
      `;

      const actionBar = document.getElementById('action-bar');
      if (canManagerAct && actionBar) {
        actionBar.innerHTML = `
          <button type="button" id="act-validate" class="px-4 py-2 text-sm bg-accent text-paper rounded-sm hover:bg-accent/90">Validate</button>
          <button type="button" id="act-revision" class="px-4 py-2 text-sm border border-rule text-ink rounded-sm hover:bg-rule/30">Request revision</button>
          <button type="button" id="act-reject" class="px-4 py-2 text-sm border border-clay text-clay rounded-sm hover:bg-clay/5">Reject</button>
        `;
        document.getElementById('act-validate')?.addEventListener('click', async () => {
          const ok = await confirm({ title: 'Validate request', message: 'Confirm this request is valid and ready for HR review?', confirmLabel: 'Validate' });
          if (!ok) return;
          try {
            await validateBooking(id, { notes: '' });
            toast('Backend not connected yet. Request not sent.', 'error');
          } catch {
            toast('Backend not connected yet. Request not sent.', 'error');
          }
        });
        document.getElementById('act-reject')?.addEventListener('click', async () => {
          openModal({
            title: 'Reject request',
            bodyHtml: `
              <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">Manager notes (required)</label>
              <textarea id="mgr-notes" rows="3" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required></textarea>
            `,
            footerHtml: `
              <button type="button" data-cancel class="px-3 py-1.5 text-sm border border-rule rounded-sm">Cancel</button>
              <button type="button" id="confirm-reject" class="px-3 py-1.5 text-sm bg-clay text-paper rounded-sm">Reject</button>
            `,
          });
          document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
          document.getElementById('confirm-reject')?.addEventListener('click', async () => {
            const notes = document.getElementById('mgr-notes')?.value?.trim();
            if (!notes) return;
            closeModal();
            try {
              await declineBooking(id, { reason: notes });
              location.reload();
            } catch (err) {
              toast(err.message || 'Action failed.', 'error');
            }
          });
        });
      }

      const run = async (fn, msg) => {
        try { await fn(); toast(msg, 'success'); setTimeout(() => location.reload(), 600); }
        catch (err) { toast(err.message || 'Action failed.', 'error'); }
      };
      const isOwner = session()?.id === booking.requesterId;
      const fld = 'class="w-full border border-rule rounded-sm px-3 py-2 text-sm"';
      const lb = 'class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1 mt-3"';
      const btnCancel = '<button type="button" data-cancel class="px-3 py-1.5 text-sm border border-rule rounded-sm">Cancel</button>';

      document.getElementById('act-revision')?.addEventListener('click', () => {
        openModal({
          title: 'Request revision',
          bodyHtml: `<label ${lb}>Comments (required)</label><textarea id="rev-notes" rows="3" ${fld}></textarea>`,
          footerHtml: `${btnCancel}<button type="button" id="rev-ok" class="px-3 py-1.5 text-sm bg-accent text-paper rounded-sm">Send</button>`,
        });
        document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
        document.getElementById('rev-ok')?.addEventListener('click', () => {
          const notes = document.getElementById('rev-notes')?.value?.trim();
          if (!notes) return;
          closeModal();
          run(() => requestRevision(id, { notes }), 'Revision requested.');
        });
      });

      if (isOwner && booking.status === 'Reschedule Proposed' && actionBar) {
        actionBar.innerHTML = `
          <p class="w-full text-sm mb-2">HR proposed: <strong>${formatDate(booking.proposedDate)}</strong>, ${formatTime(booking.proposedStartTime)} – ${formatTime(booking.proposedEndTime)}${booking.proposalNotes ? ' — ' + escapeHtml(booking.proposalNotes) : ''}</p>
          <button type="button" id="act-accept" class="px-4 py-2 text-sm bg-accent text-paper rounded-sm">Accept new schedule</button>
          <button type="button" id="act-refuse" class="px-4 py-2 text-sm border border-clay text-clay rounded-sm">Reject (booking will be declined)</button>`;
        document.getElementById('act-accept').addEventListener('click', () => run(() => respondReschedule(id, { accept: true }), 'Schedule accepted.'));
        document.getElementById('act-refuse').addEventListener('click', async () => {
          if (await confirm({ title: 'Reject proposal?', message: 'Rejecting will decline this booking request.' })) run(() => respondReschedule(id, { accept: false }), 'Proposal rejected.');
        });
      }

      if (isOwner && booking.status === 'Revision Requested' && actionBar) {
        actionBar.innerHTML = `<p class="w-full text-sm mb-2">Manager comments: ${escapeHtml(booking.managerNotes || '—')}</p>
          <button type="button" id="act-edit" class="px-4 py-2 text-sm bg-accent text-paper rounded-sm">Edit &amp; resubmit</button>`;
        document.getElementById('act-edit').addEventListener('click', () => {
          openModal({
            title: 'Edit & resubmit',
            bodyHtml: `<label ${lb}>Date</label><input id="e-date" type="date" value="${booking.date}" ${fld} />
              <label ${lb}>Start</label><input id="e-start" type="time" value="${booking.startTime}" ${fld} />
              <label ${lb}>End</label><input id="e-end" type="time" value="${booking.endTime}" ${fld} />
              <label ${lb}>Attendees</label><input id="e-att" type="number" min="1" value="${booking.attendees}" ${fld} />
              <label ${lb}>Purpose</label><textarea id="e-purpose" rows="3" ${fld}>${escapeHtml(booking.purpose || '')}</textarea>`,
            footerHtml: `${btnCancel}<button type="button" id="e-ok" class="px-3 py-1.5 text-sm bg-accent text-paper rounded-sm">Resubmit</button>`,
          });
          document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
          document.getElementById('e-ok')?.addEventListener('click', () => {
            const g = (x) => document.getElementById(x).value;
            closeModal();
            run(() => resubmitBooking(id, { date: g('e-date'), startTime: g('e-start'), endTime: g('e-end'), attendees: Number(g('e-att')), purpose: g('e-purpose') }), 'Resubmitted.');
          });
        });
      }

      if (canHrAct && actionBar) {
        actionBar.innerHTML = `
          <button type="button" id="act-approve" class="px-4 py-2 text-sm bg-accent text-paper rounded-sm hover:bg-accent/90">Approve</button>
          <button type="button" id="act-decline" class="px-4 py-2 text-sm border border-clay text-clay rounded-sm hover:bg-clay/5">Decline</button>
          <button type="button" id="act-reschedule" class="px-4 py-2 text-sm border border-rule text-ink rounded-sm hover:bg-rule/30">Reschedule</button>
        `;

        document.getElementById('act-approve')?.addEventListener('click', () => {
          openModal({
            title: 'Approve this booking?',
            bodyHtml: `
              <p class="text-sm text-ink mb-3">Confirm approval of this booking request.</p>
              <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">Optional note</label>
              <textarea id="hr-note" rows="2" class="w-full border border-rule rounded-sm px-3 py-2 text-sm"></textarea>
            `,
            footerHtml: `
              <button type="button" data-cancel class="px-3 py-1.5 text-sm border border-rule rounded-sm">Cancel</button>
              <button type="button" id="confirm-approve" class="px-3 py-1.5 text-sm bg-accent text-paper rounded-sm">Confirm</button>
            `,
          });
          document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
          document.getElementById('confirm-approve')?.addEventListener('click', async () => {
            const notes = document.getElementById('hr-note')?.value?.trim() || '';
            closeModal();
            try {
              await approveBooking(id, { notes });
            } catch {
              toast('Backend not connected yet. Request not sent.', 'error');
            }
          });
        });

        document.getElementById('act-decline')?.addEventListener('click', () => {
          openModal({
            title: 'Decline booking',
            bodyHtml: `
              <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">HR reason (required)</label>
              <textarea id="hr-reason" rows="3" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required></textarea>
              <p id="decline-err" class="text-xs text-clay mt-1 hidden">Reason is required.</p>
            `,
            footerHtml: `
              <button type="button" data-cancel class="px-3 py-1.5 text-sm border border-rule rounded-sm">Cancel</button>
              <button type="button" id="confirm-decline" class="px-3 py-1.5 text-sm bg-clay text-paper rounded-sm">Decline</button>
            `,
          });
          document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
          document.getElementById('confirm-decline')?.addEventListener('click', async () => {
            const reason = document.getElementById('hr-reason')?.value?.trim();
            if (!reason) {
              document.getElementById('decline-err')?.classList.remove('hidden');
              return;
            }
            closeModal();
            try {
              await declineBooking(id, { reason });
            } catch {
              toast('Backend not connected yet. Request not sent.', 'error');
            }
          });
        });

        document.getElementById('act-reschedule')?.addEventListener('click', () => {
          openModal({
            title: 'Reschedule booking',
            wide: true,
            bodyHtml: `
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                <div>
                  <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">New date</label>
                  <input type="date" id="rs-date" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required />
                </div>
                <div>
                  <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">Start</label>
                  <input type="time" id="rs-start" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required />
                </div>
                <div>
                  <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">End</label>
                  <input type="time" id="rs-end" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required />
                </div>
              </div>
              <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">HR reason (required)</label>
              <textarea id="rs-reason" rows="2" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required></textarea>
              <p id="rs-err" class="text-xs text-clay mt-1 hidden">All fields are required.</p>
            `,
            footerHtml: `
              <button type="button" data-cancel class="px-3 py-1.5 text-sm border border-rule rounded-sm">Cancel</button>
              <button type="button" id="confirm-rs" class="px-3 py-1.5 text-sm bg-ink text-paper rounded-sm">Reschedule</button>
            `,
          });
          document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
          document.getElementById('confirm-rs')?.addEventListener('click', async () => {
            const date = document.getElementById('rs-date')?.value;
            const startTime = document.getElementById('rs-start')?.value;
            const endTime = document.getElementById('rs-end')?.value;
            const reason = document.getElementById('rs-reason')?.value?.trim();
            if (!date || !startTime || !endTime || !reason) {
              document.getElementById('rs-err')?.classList.remove('hidden');
              return;
            }
            closeModal();
            try {
              await rescheduleBooking(id, { date, startTime, endTime, reason, notes: reason });
            } catch {
              toast('Backend not connected yet. Request not sent.', 'error');
            }
          });
        });
      }
    };
  </script>
</body>
</html>
