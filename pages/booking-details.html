<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Details — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Inter Tight"', 'system-ui', 'sans-serif'],
          },
          colors: {
            paper: '#faf8f5',
            ink: '#1a1815',
            muted: '#6b6560',
            rule: '#e8e4dd',
            accent: '#3d6b66',
            'accent-soft': '#e6efee',
            clay: '#b5623f',
          },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: {
            card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)',
          },
        },
      },
    };
  </script>
  <style>
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url('../assets/noise.svg');
      background-repeat: repeat;
    }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="Booking Details">
  <div id="app">
    <div id="detail-root">
      <div class="flex items-center justify-center py-20 text-muted text-sm">Loading…</div>
    </div>
  </div>

  <script type="module">
    import '../js/app.js';
    import { getBooking, getVenues, validateBooking, approveBooking, declineBooking, rescheduleBooking, requestRevision, respondReschedule, resubmitBooking, emergencyOverride, getCompeting } from '../js/api.js';
    import { role, session } from '../js/auth.js';
    import { parseQuery, formatDate, formatTime, formatDateTime, escapeHtml } from '../js/utils.js';
    import { statusBadge } from '../components/status-badge.js';
    import { timeline } from '../components/timeline.js';
    import { emptyState } from '../components/empty-state.js';
    import { openModal, closeModal, confirm } from '../components/modal.js';
    import { toast, flash } from '../components/toast.js';

    window.__pageInit = async function () {
      const { id } = parseQuery();
      const root = document.getElementById('detail-root');

      if (!id) {
        root.innerHTML = emptyState({ title: 'No booking requests found.', hint: 'Missing request id.' });
        return;
      }

      let booking;
      try {
        booking = await getBooking(id);
      } catch {
        root.innerHTML = emptyState({
          title: 'No booking requests found.',
          hint: 'Unable to load this request. Backend not connected yet.',
        });
        toast('Unable to load booking. Backend not connected yet.', 'error');
        return;
      }

      const r = role();
      const canManagerAct = r === 'Manager' && booking.status === 'Pending Manager Validation';
      const isOwner = session()?.id === booking.requesterId;
      const canHrAct = ['HR', 'Administrator'].includes(r) && ['Pending HR Decision', 'Manager Validated'].includes(booking.status);
      // The requester answers a reschedule proposal / edits a returned request from this same Actions panel.
      const ownerCanAct = isOwner && ['Reschedule Proposed', 'Revision Requested'].includes(booking.status);
      // HR/Admin can pull an already-confirmed booking in an emergency (never their own).
      const canOverride = ['HR', 'Administrator'].includes(r) && !isOwner
        && ['Approved', 'Rescheduled', 'Reschedule Proposed'].includes(booking.status) && booking.phase !== 'done';
      const showActions = canHrAct || canManagerAct || ownerCanAct || canOverride;

      const dl = (label, value) => `
        <div class="py-3 border-b border-rule">
          <dt class="text-[11px] uppercase tracking-[0.08em] text-muted">${escapeHtml(label)}</dt>
          <dd class="mt-1 text-sm text-ink">${value ?? '—'}</dd>
        </div>`;

      root.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8 lg:gap-12">
          <div class="lg:col-span-3">
            <div class="flex items-start justify-between gap-4 mb-6">
              <div>
                <p class="text-xs text-muted tracking-wide">${escapeHtml(booking.ref || booking.id || '')}</p>
                <h2 class="font-display text-2xl font-medium tracking-[-0.02em] mt-1">${escapeHtml(booking.purpose || 'Booking Request')}</h2>
              </div>
              <div>${statusBadge(booking)}</div>
            </div>

            <dl class="mb-10">
              ${dl('Requester', escapeHtml(booking.requesterName || booking.requester))}
              ${dl('Department', escapeHtml(booking.department))}
              ${dl('Department Manager', escapeHtml(booking.departmentManager || booking.managerName))}
              ${dl('Venue', escapeHtml(booking.venueName || booking.venue))}
              ${dl('Event Type', escapeHtml(booking.eventType))}
              ${dl('Date', formatDate(booking.date))}
              ${dl('Time', `${formatTime(booking.startTime)} – ${formatTime(booking.endTime)}`)}
              ${dl('Attendees', escapeHtml(String(booking.attendees ?? '—')))}
              ${dl('Requirements', (booking.requirements || []).map((r) => escapeHtml(r.name) + (r.quantity > 1 ? ' ×' + r.quantity : '')).join(', ') || '—')}
              ${dl('Other Notes', escapeHtml(booking.additionalRequirements || '—'))}
              ${dl('Manager Notes', escapeHtml(booking.managerNotes || '—'))}
              ${dl('HR Notes', escapeHtml(booking.hrNotes || '—'))}
              ${booking.cancelReason ? dl('Cancellation reason', escapeHtml(booking.cancelReason)) : ''}
              ${dl('Created', formatDateTime(booking.createdAt || booking.createdDate))}
              ${dl('Last Updated', formatDateTime(booking.updatedAt || booking.lastUpdatedDate))}
            </dl>

            ${showActions ? `
              <div class="border border-rule rounded-sm p-5 mb-8">
                <p class="text-[11px] uppercase tracking-[0.08em] text-muted mb-4">Actions</p>
                <div class="flex flex-wrap gap-2" id="action-bar"></div>
              </div>
            ` : ''}
          </div>

          <div class="lg:col-span-2 lg:border-l lg:border-rule lg:pl-8">
            <h3 class="font-display text-lg font-medium tracking-[-0.02em] mb-6">Timeline</h3>
            <div id="timeline-root">${timeline(booking)}</div>
          </div>
        </div>
      `;

      const actionBar = document.getElementById('action-bar');
      if (canManagerAct && actionBar) {
        actionBar.innerHTML = `
          <button type="button" id="act-validate" class="px-4 py-2 text-sm bg-accent text-paper rounded-sm hover:bg-accent/90">Validate</button>
          <button type="button" id="act-revision" class="px-4 py-2 text-sm border border-rule text-ink rounded-sm hover:bg-rule/30">Request revision</button>
          <button type="button" id="act-reject" class="px-4 py-2 text-sm border border-clay text-clay rounded-sm hover:bg-clay/5">Reject</button>
        `;
        document.getElementById('act-validate')?.addEventListener('click', async () => {
          const ok = await confirm({ title: 'Validate request', message: 'Confirm this request is valid and ready for HR review?', confirmLabel: 'Validate' });
          if (!ok) return;
          run(() => validateBooking(id, { notes: '' }), `Request ${booking.ref} validated and sent to HR for the final decision.`);
        });
        document.getElementById('act-reject')?.addEventListener('click', async () => {
          openModal({
            title: 'Reject request',
            bodyHtml: `
              <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">Manager notes (required)</label>
              <textarea id="mgr-notes" rows="3" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required></textarea>
            `,
            footerHtml: `
              <button type="button" data-cancel class="px-3 py-1.5 text-sm border border-rule rounded-sm">Cancel</button>
              <button type="button" id="confirm-reject" class="px-3 py-1.5 text-sm bg-clay text-paper rounded-sm">Reject</button>
            `,
          });
          document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
          document.getElementById('confirm-reject')?.addEventListener('click', async () => {
            const notes = document.getElementById('mgr-notes')?.value?.trim();
            if (!notes) return;
            closeModal();
            run(() => declineBooking(id, { reason: notes }), `Request ${booking.ref} rejected. The requester can see your note.`);
          });
        });
      }

      const run = async (fn, msg) => {
        try {
          const out = await fn();
          flash(typeof msg === 'function' ? msg(out) : msg, 'success'); // shown again after the reload so it isn't lost
          location.reload();
        } catch (err) {
          toast(err.message || 'Action failed.', 'error');
        }
      };
      const fld = 'class="w-full border border-rule rounded-sm px-3 py-2 text-sm"';
      const lb = 'class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1 mt-3"';
      const btnCancel = '<button type="button" data-cancel class="px-3 py-1.5 text-sm border border-rule rounded-sm">Cancel</button>';

      document.getElementById('act-revision')?.addEventListener('click', () => {
        openModal({
          title: 'Request revision',
          bodyHtml: `<label ${lb}>Comments (required)</label><textarea id="rev-notes" rows="3" ${fld}></textarea>`,
          footerHtml: `${btnCancel}<button type="button" id="rev-ok" class="px-3 py-1.5 text-sm bg-accent text-paper rounded-sm">Send</button>`,
        });
        document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
        document.getElementById('rev-ok')?.addEventListener('click', () => {
          const notes = document.getElementById('rev-notes')?.value?.trim();
          if (!notes) return;
          closeModal();
          run(() => requestRevision(id, { notes }), `Revision requested for ${booking.ref}. The requester has been notified.`);
        });
      });

      if (isOwner && booking.status === 'Reschedule Proposed' && actionBar) {
        actionBar.innerHTML = `
          <p class="w-full text-sm mb-2">HR proposed: <strong>${formatDate(booking.proposedDate)}</strong>, ${formatTime(booking.proposedStartTime)} – ${formatTime(booking.proposedEndTime)}${booking.proposalNotes ? ' — ' + escapeHtml(booking.proposalNotes) : ''}</p>
          <button type="button" id="act-accept" class="px-4 py-2 text-sm bg-accent text-paper rounded-sm">Accept new schedule</button>
          <button type="button" id="act-refuse" class="px-4 py-2 text-sm border border-clay text-clay rounded-sm">Reject (booking will be declined)</button>`;
        document.getElementById('act-accept').addEventListener('click', () => run(() => respondReschedule(id, { accept: true }), `You accepted the new schedule for ${booking.ref}.`));
        document.getElementById('act-refuse').addEventListener('click', async () => {
          if (await confirm({ title: 'Reject proposal?', message: 'Rejecting will decline this booking request.' })) run(() => respondReschedule(id, { accept: false }), `You rejected the proposal, so ${booking.ref} was declined.`);
        });
      }

      if (isOwner && booking.status === 'Revision Requested' && actionBar) {
        actionBar.innerHTML = `<p class="w-full text-sm mb-2">Revision notes: ${escapeHtml(booking.managerNotes || booking.hrNotes || '—')}</p>
          <button type="button" id="act-edit" class="px-4 py-2 text-sm bg-accent text-paper rounded-sm">Edit &amp; resubmit</button>`;
        document.getElementById('act-edit').addEventListener('click', async () => {
          // Load venues so the user can change room; pre-fill every field from the current booking.
          let venueOptions = `<option value="${booking.venueId}">${escapeHtml(booking.venueName || 'Current venue')}</option>`;
          const venueCaps = new Map();
          try {
            const data = await getVenues({ status: 'Available' });
            const list = Array.isArray(data) ? data : data?.items || [];
            if (list.length) {
              venueOptions = list.map((v) => {
                const cap = v.capacity != null ? Number(v.capacity) : null;
                if (cap != null) venueCaps.set(String(v.id), cap);
                const sel = String(v.id) === String(booking.venueId) ? ' selected' : '';
                const capLabel = cap != null ? ` (cap. ${cap})` : '';
                return `<option value="${v.id}"${sel}>${escapeHtml(v.name || String(v.id))}${capLabel}</option>`;
              }).join('');
            }
          } catch (_) { /* keep single current-venue option */ }

          const eventTypes = ['Meeting', 'Training', 'Conference', 'Workshop', 'Social', 'Other'];
          const etOpts = eventTypes.map((t) => {
            const sel = (booking.eventType || '') === t ? ' selected' : '';
            return `<option value="${t}"${sel}>${t}</option>`;
          }).join('');

          const startVal = (booking.startTime || '').slice(0, 5);
          const endVal = (booking.endTime || '').slice(0, 5);

          openModal({
            title: 'Edit & resubmit',
            wide: true,
            bodyHtml: `
              <p class="text-sm text-muted mb-3">Update the booking details below. The same rules as a new request apply (capacity, hours, conflicts). Unchanged fields keep their original values until you edit them.</p>
              <p id="e-err" class="hidden mb-2 text-sm text-clay"></p>
              <label ${lb}>Venue</label>
              <select id="e-venue" ${fld}>${venueOptions}</select>
              <label ${lb}>Date</label>
              <input id="e-date" type="date" value="${escapeHtml(booking.date || '')}" ${fld} />
              <label ${lb}>Start</label>
              <input id="e-start" type="time" value="${escapeHtml(startVal)}" ${fld} />
              <label ${lb}>End</label>
              <input id="e-end" type="time" value="${escapeHtml(endVal)}" ${fld} />
              <label ${lb}>Event type</label>
              <select id="e-eventType" ${fld}><option value="">Select…</option>${etOpts}</select>
              <label ${lb}>Attendees</label>
              <input id="e-att" type="number" min="1" value="${Number(booking.attendees) || 1}" ${fld} />
              <p id="e-cap-hint" class="text-xs text-muted mt-1"></p>
              <label ${lb}>Purpose</label>
              <textarea id="e-purpose" rows="3" ${fld}>${escapeHtml(booking.purpose || '')}</textarea>
              <label ${lb}>Additional requirements (optional)</label>
              <textarea id="e-addl" rows="2" ${fld}>${escapeHtml(booking.additionalRequirements || '')}</textarea>
            `,
            footerHtml: `${btnCancel}<button type="button" id="e-ok" class="px-3 py-1.5 text-sm bg-accent text-paper rounded-sm">Resubmit</button>`,
          });

          const showCapHint = () => {
            const cap = venueCaps.get(String(document.getElementById('e-venue')?.value));
            const hint = document.getElementById('e-cap-hint');
            const att = document.getElementById('e-att');
            if (hint && cap != null) {
              hint.textContent = `This venue holds up to ${cap} people.`;
              if (att) att.max = String(cap);
            } else if (hint) {
              hint.textContent = '';
              if (att) att.removeAttribute('max');
            }
          };
          document.getElementById('e-venue')?.addEventListener('change', showCapHint);
          showCapHint();

          document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
          document.getElementById('e-ok')?.addEventListener('click', () => {
            // Read values BEFORE closeModal() — closing removes the inputs from the DOM.
            const venueId = Number(document.getElementById('e-venue')?.value || 0);
            const date = document.getElementById('e-date')?.value || '';
            const startTime = document.getElementById('e-start')?.value || '';
            const endTime = document.getElementById('e-end')?.value || '';
            const eventType = document.getElementById('e-eventType')?.value || '';
            const attendees = Number(document.getElementById('e-att')?.value || 1);
            const purpose = (document.getElementById('e-purpose')?.value || '').trim();
            const additionalRequirements = (document.getElementById('e-addl')?.value || '').trim();
            const errEl = document.getElementById('e-err');
            const cap = venueCaps.get(String(venueId));

            const problems = [];
            if (!venueId) problems.push('Select a venue.');
            if (!date) problems.push('Date is required.');
            if (!startTime) problems.push('Start time is required.');
            if (!endTime) problems.push('End time is required.');
            if (!eventType) problems.push('Event type is required.');
            if (!purpose) problems.push('Purpose is required.');
            if (!Number.isFinite(attendees) || attendees < 1) problems.push('Attendees must be at least 1.');
            if (cap != null && attendees > cap) {
              problems.push(`Cannot proceed: ${attendees} attendees exceed this venue's capacity limit of ${cap}.`);
            }
            if (startTime && endTime && startTime >= endTime) {
              problems.push('End time must be after start time.');
            }
            if (problems.length) {
              if (errEl) {
                errEl.textContent = problems.join(' ');
                errEl.classList.remove('hidden');
              }
              toast(problems[0], 'error');
              return;
            }

            closeModal();
            run(
              () => resubmitBooking(id, {
                venueId,
                date,
                startTime,
                endTime,
                eventType,
                attendees,
                purpose,
                additionalRequirements: additionalRequirements || null,
              }),
              `${booking.ref} was resubmitted for review.`
            );
          });
        });
      }

      if (canHrAct && actionBar) {
        actionBar.innerHTML = `
          <button type="button" id="act-approve" class="px-4 py-2 text-sm bg-accent text-paper rounded-sm hover:bg-accent/90">Approve</button>
          <button type="button" id="act-decline" class="px-4 py-2 text-sm border border-clay text-clay rounded-sm hover:bg-clay/5">Decline</button>
          <button type="button" id="act-reschedule" class="px-4 py-2 text-sm border border-rule text-ink rounded-sm hover:bg-rule/30">Reschedule</button>
        `;

        document.getElementById('act-approve')?.addEventListener('click', async () => {
          // Preview which competing requests approval will handle automatically (HR keeps the final say).
          let info = null;
          try { info = await getCompeting(id); } catch { /* approval itself still works without the preview */ }
          const competing = info?.competing || [];
          const heldBy = info?.heldBy;
          const verb = info?.action === 'decline' ? 'declined' : 'moved to the nearest free time (or declined if none is free)';
          const reachedFirst = competing.some((c) => c.validatedFirst);
          const warn = `
            ${heldBy ? `<div class="mb-3 rounded-sm border border-clay/40 bg-clay/5 p-3 text-sm text-clay">This time is already held by <strong>${escapeHtml(heldBy.ref)}</strong>. Approval will be refused unless that booking is cancelled or moved first.</div>` : ''}
            ${competing.length ? `<div class="mb-3 rounded-sm border border-rule bg-rule/20 p-3 text-sm">
              <p class="mb-1">Approving this will automatically handle ${competing.length} competing request${competing.length > 1 ? 's' : ''} for the same time. ${competing.length > 1 ? 'They' : 'It'} will be ${verb}:</p>
              <ul class="list-disc pl-5">${competing.map((c) => `<li>${escapeHtml(c.ref)} — ${escapeHtml(c.requesterName)}${c.validatedFirst ? ' <strong>(reached HR before this request)</strong>' : ''}</li>`).join('')}</ul>
              ${reachedFirst ? '<p class="mt-2 text-xs text-muted">Normally the request that reached HR first is approved. You can still approve this one — HR has the final say.</p>' : ''}
            </div>` : ''}`;
          openModal({
            title: 'Approve this booking?',
            bodyHtml: `
              ${warn}
              <p class="text-sm text-ink mb-3">Confirm approval of this booking request.</p>
              <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">Optional note</label>
              <textarea id="hr-note" rows="2" class="w-full border border-rule rounded-sm px-3 py-2 text-sm"></textarea>
            `,
            footerHtml: `
              <button type="button" data-cancel class="px-3 py-1.5 text-sm border border-rule rounded-sm">Cancel</button>
              <button type="button" id="confirm-approve" class="px-3 py-1.5 text-sm bg-accent text-paper rounded-sm">Confirm</button>
            `,
          });
          document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
          document.getElementById('confirm-approve')?.addEventListener('click', async () => {
            const notes = document.getElementById('hr-note')?.value?.trim() || '';
            closeModal();
            run(() => approveBooking(id, { notes }), (res) => {
              const n = res?.autoResolved?.length || 0;
              return `Booking ${booking.ref} approved. The requester has been notified.` + (n ? ` ${n} competing request${n > 1 ? 's were' : ' was'} handled automatically.` : '');
            });
          });
        });

        document.getElementById('act-decline')?.addEventListener('click', () => {
          openModal({
            title: 'Decline booking',
            bodyHtml: `
              <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">HR reason (required)</label>
              <textarea id="hr-reason" rows="3" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required></textarea>
              <p id="decline-err" class="text-xs text-clay mt-1 hidden">Reason is required.</p>
            `,
            footerHtml: `
              <button type="button" data-cancel class="px-3 py-1.5 text-sm border border-rule rounded-sm">Cancel</button>
              <button type="button" id="confirm-decline" class="px-3 py-1.5 text-sm bg-clay text-paper rounded-sm">Decline</button>
            `,
          });
          document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
          document.getElementById('confirm-decline')?.addEventListener('click', async () => {
            const reason = document.getElementById('hr-reason')?.value?.trim();
            if (!reason) {
              document.getElementById('decline-err')?.classList.remove('hidden');
              return;
            }
            closeModal();
            run(() => declineBooking(id, { reason }), `Booking ${booking.ref} declined. The requester has been notified.`);
          });
        });

        document.getElementById('act-reschedule')?.addEventListener('click', () => {
          openModal({
            title: 'Reschedule booking',
            wide: true,
            bodyHtml: `
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                <div>
                  <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">New date</label>
                  <input type="date" id="rs-date" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required />
                </div>
                <div>
                  <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">Start</label>
                  <input type="time" id="rs-start" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required />
                </div>
                <div>
                  <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">End</label>
                  <input type="time" id="rs-end" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required />
                </div>
              </div>
              <label class="block text-[11px] uppercase tracking-[0.08em] text-muted mb-1.5">HR reason (required)</label>
              <textarea id="rs-reason" rows="2" class="w-full border border-rule rounded-sm px-3 py-2 text-sm" required></textarea>
              <p id="rs-err" class="text-xs text-clay mt-1 hidden">All fields are required.</p>
            `,
            footerHtml: `
              <button type="button" data-cancel class="px-3 py-1.5 text-sm border border-rule rounded-sm">Cancel</button>
              <button type="button" id="confirm-rs" class="px-3 py-1.5 text-sm bg-ink text-paper rounded-sm">Reschedule</button>
            `,
          });
          document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
          document.getElementById('confirm-rs')?.addEventListener('click', async () => {
            const date = document.getElementById('rs-date')?.value;
            const startTime = document.getElementById('rs-start')?.value;
            const endTime = document.getElementById('rs-end')?.value;
            const reason = document.getElementById('rs-reason')?.value?.trim();
            if (!date || !startTime || !endTime || !reason) {
              document.getElementById('rs-err')?.classList.remove('hidden');
              return;
            }
            closeModal();
            run(() => rescheduleBooking(id, { date, startTime, endTime, reason, notes: reason }), `New schedule proposed for ${booking.ref}. The requester was asked to respond.`);
          });
        });
      }

      if (canOverride && actionBar) {
        actionBar.innerHTML = `
          <p class="w-full text-xs text-muted mb-1">Only for urgent use of the venue. The requester and department manager are notified at once and this is logged.</p>
          <button type="button" id="act-override" class="px-4 py-2 text-sm border border-clay text-clay rounded-sm hover:bg-clay/5">Emergency override</button>`;
        document.getElementById('act-override').addEventListener('click', () => {
          openModal({
            title: 'Emergency override',
            wide: true,
            bodyHtml: `
              <label ${lb}>What should happen to ${escapeHtml(booking.ref)}?</label>
              <select id="ov-mode" ${fld}>
                <option value="reschedule">Move it to another time</option>
                <option value="cancel">Cancel it</option>
              </select>
              <div id="ov-when">
                <p class="text-xs text-muted mt-3">Leave date and times empty to move it to the nearest free slot automatically.</p>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div><label ${lb}>New date</label><input type="date" id="ov-date" ${fld} /></div>
                  <div><label ${lb}>Start</label><input type="time" id="ov-start" ${fld} /></div>
                  <div><label ${lb}>End</label><input type="time" id="ov-end" ${fld} /></div>
                </div>
              </div>
              <label ${lb}>Reason (required)</label>
              <textarea id="ov-reason" rows="3" maxlength="500" ${fld}></textarea>
              <label class="mt-4 flex items-start gap-2 text-sm">
                <input type="checkbox" id="ov-take" class="mt-1" />
                <span>Also book this time for me now<br><span class="text-xs text-muted">Confirmed immediately in the same step, so nobody can take the freed time in between. The reason above is kept on your booking.</span></span>
              </label>
              <div id="ov-take-fields" class="hidden mt-2 grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="sm:col-span-2"><label ${lb}>What is it for?</label><input type="text" id="ov-purpose" maxlength="500" ${fld} /></div>
                <div><label ${lb}>Attendees</label><input type="number" min="1" id="ov-attendees" value="1" ${fld} /></div>
              </div>
              <p id="ov-err" class="text-xs text-clay mt-2 hidden"></p>
            `,
            footerHtml: `${btnCancel}<button type="button" id="ov-ok" class="px-3 py-1.5 text-sm bg-clay text-paper rounded-sm">Apply override</button>`,
          });
          document.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
          const modeEl = document.getElementById('ov-mode');
          document.getElementById('ov-take').addEventListener('change', (e) => {
            document.getElementById('ov-take-fields').classList.toggle('hidden', !e.target.checked);
          });
          modeEl.addEventListener('change', () => {
            document.getElementById('ov-when').classList.toggle('hidden', modeEl.value === 'cancel');
          });
          document.getElementById('ov-ok').addEventListener('click', async () => {
            const err = document.getElementById('ov-err');
            const fail = (m) => { err.textContent = m; err.classList.remove('hidden'); };
            err.classList.add('hidden');
            const mode = modeEl.value;
            const reason = document.getElementById('ov-reason').value.trim();
            const date = document.getElementById('ov-date').value;
            const startTime = document.getElementById('ov-start').value;
            const endTime = document.getElementById('ov-end').value;
            if (!reason) return fail('A reason is required.');
            const takeOver = document.getElementById('ov-take').checked;
            const purpose = document.getElementById('ov-purpose').value.trim();
            const attendees = Math.max(1, parseInt(document.getElementById('ov-attendees').value, 10) || 1);
            if (takeOver && !purpose) return fail('Say what the venue is needed for.');
            const given = [date, startTime, endTime].filter(Boolean).length;
            if (mode === 'reschedule' && given !== 0 && given !== 3) return fail('Fill in the date, start and end — or leave all three empty.');
            const btn = document.getElementById('ov-ok');
            btn.disabled = true;
            try {
              const payload = mode === 'cancel' ? { mode, reason } : { mode, reason, ...(given === 3 ? { date, startTime, endTime } : {}) };
              if (takeOver) Object.assign(payload, { takeOver: true, purpose, attendees });
              const res = await emergencyOverride(id, payload);
              closeModal();
              flash((mode === 'cancel'
                ? `${booking.ref} was cancelled. The requester has been notified.`
                : `${booking.ref} was moved. The requester has been notified.`)
                + (res?.takeOverBooking?.ref ? ` The time is now booked for you (${res.takeOverBooking.ref}).` : ''), 'success');
              location.reload();
            } catch (e) {
              btn.disabled = false;
              fail(e.message || 'The override could not be applied.');
            }
          });
        });
      }
    };
  </script>
</body>
</html>
