<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Bookings — Venue Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['Fraunces', 'Georgia', 'serif'], sans: ['"Inter Tight"', 'system-ui', 'sans-serif'] },
          colors: { paper: '#faf8f5', ink: '#1a1815', muted: '#6b6560', rule: '#e8e4dd', accent: '#3d6b66', 'accent-soft': '#e6efee', clay: '#b5623f' },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: { card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)' },
        },
      },
    };
  </script>
  <style>body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.03;background-image:url('/assets/noise.svg');background-repeat:repeat}</style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="All Bookings">
  <div id="app">
    <div id="page-header"></div>
    <div id="status-filters" class="flex flex-wrap gap-2 mb-6"></div>
    <div id="bookings-table"></div>
  </div>
  <script type="module">
    import '../js/app.js';
    import { getBookings } from '../js/api.js';
    import { ui, pageHeader } from '../js/ui.js';
    import { dataTable } from '../components/data-table.js';
    import { statusBadge } from '../components/status-badge.js';
    import { formatDate } from '../js/utils.js';
    import { toast } from '../components/toast.js';

    const FILTERS = [
      { value: '', label: 'All' },
      { value: 'Pending Manager Validation', label: 'Pending Manager' },
      { value: 'Pending HR Decision', label: 'Pending HR' },
      { value: 'Approved', label: 'Approved' },
      { value: 'Declined', label: 'Declined' },
      { value: 'Rescheduled', label: 'Rescheduled' },
    ];

    let currentStatus = '';

    async function load(status) {
      const el = document.getElementById('bookings-table');
      try {
        const data = await getBookings(status ? { status } : {});
        const list = Array.isArray(data) ? data : data?.items || [];
        dataTable({
          container: el,
          columns: [
            { key: 'ref', label: 'Reference', render: (r) => r.ref || r.id || '—' },
            { key: 'requester', label: 'Requester', render: (r) => r.requesterName || r.requester || '—' },
            { key: 'venue', label: 'Venue', render: (r) => r.venueName || r.venue || '—' },
            { key: 'date', label: 'Date', render: (r) => formatDate(r.date) },
            { key: 'status', label: 'Status', render: (r) => statusBadge(r.status), sortable: false },
          ],
          rows: list,
          empty: { title: 'No booking requests found.' },
          onRowClick: (row) => { window.location.href = `/pages/booking-details.html?id=${encodeURIComponent(row.id)}`; },
        });
      } catch {
        dataTable({ container: el, columns: [], rows: [], empty: { title: 'No booking requests found.' } });
        toast('Unable to load bookings. Backend not connected yet.', 'error');
      }
    }

    window.__pageInit = async function () {
      document.getElementById('page-header').innerHTML = pageHeader({
        description: 'Browse and filter all booking records across the organization.',
      });
      const filtersEl = document.getElementById('status-filters');
      filtersEl.innerHTML = FILTERS.map((f, i) => `
        <button type="button" data-status="${f.value}" class="filter-chip ${ui.chip} ${i === 0 ? ui.chipActive : ui.chipIdle}">${f.label}</button>
      `).join('');
      filtersEl.querySelectorAll('.filter-chip').forEach((btn) => {
        btn.addEventListener('click', () => {
          filtersEl.querySelectorAll('.filter-chip').forEach((b) => {
            b.className = `filter-chip ${ui.chip} ${ui.chipIdle}`;
          });
          btn.className = `filter-chip ${ui.chip} ${ui.chipActive}`;
          currentStatus = btn.getAttribute('data-status') || '';
          load(currentStatus);
        });
      });
      await load('');
    };
  </script>
</body>
</html>
