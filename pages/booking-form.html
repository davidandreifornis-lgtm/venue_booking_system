<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Booking Request — Venue Booking</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/shell.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['Fraunces', 'Georgia', 'serif'], sans: ['"Inter Tight"', 'system-ui', 'sans-serif'] },
          colors: { paper: '#faf8f5', ink: '#1a1815', muted: '#6b6560', rule: '#e8e4dd', accent: '#3d6b66', 'accent-soft': '#e6efee', clay: '#b5623f' },
          borderRadius: { DEFAULT: '4px', sm: '2px' },
          boxShadow: { card: '0 1px 0 rgba(0,0,0,0.03), 0 8px 24px -16px rgba(0,0,0,0.14)' },
        },
      },
    };
  </script>
  <style>body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.03;background-image:url('../assets/noise.svg');background-repeat:repeat}</style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-page-title="New Booking Request">
  <div id="app">
    <div id="page-header"></div>
    <form id="booking-form" class="max-w-4xl" novalidate>
      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div class="sm:col-span-2">
          <label class="mb-1.5 block text-[11px] font-medium uppercase tracking-[0.08em] text-muted" for="venueId">Venue</label>
          <select name="venueId" id="venueId" required class="w-full rounded border border-rule bg-paper px-3 py-2.5 text-sm text-ink outline-none focus:border-ink/40 focus:ring-1 focus:ring-ink/10">
            <option value="">Select venue…</option>
          </select>
          <p class="field-error mt-1 text-xs text-clay hidden" data-for="venueId"></p>
        </div>
        <div class="sm:col-span-2">
          <span class="mb-1.5 block text-[11px] font-medium uppercase tracking-[0.08em] text-muted">Date &amp; time</span>
          <div id="booking-calendar"></div>
          <input type="hidden" name="date" id="date" />
          <input type="hidden" name="startTime" id="startTime" />
          <input type="hidden" name="endTime" id="endTime" />
          <p class="field-error mt-2 text-xs text-clay hidden" data-for="date"></p>
          <p class="field-error mt-1 text-xs text-clay hidden" data-for="startTime"></p>
          <p class="field-error mt-1 text-xs text-clay hidden" data-for="endTime"></p>
        </div>
        <div class="sm:col-span-2">
          <label class="mb-1.5 block text-[11px] font-medium uppercase tracking-[0.08em] text-muted" for="purpose">Purpose</label>
          <input type="text" name="purpose" id="purpose" required class="w-full rounded border border-rule bg-paper px-3 py-2.5 text-sm text-ink outline-none focus:border-ink/40 focus:ring-1 focus:ring-ink/10" placeholder="Brief purpose of the event" />
          <p class="field-error mt-1 text-xs text-clay hidden" data-for="purpose"></p>
        </div>
        <div>
          <label class="mb-1.5 block text-[11px] font-medium uppercase tracking-[0.08em] text-muted" for="eventType">Event type</label>
          <select name="eventType" id="eventType" required class="w-full rounded border border-rule bg-paper px-3 py-2.5 text-sm text-ink outline-none focus:border-ink/40 focus:ring-1 focus:ring-ink/10">
            <option value="">Select…</option>
            <option>Meeting</option>
            <option>Training</option>
            <option>Conference</option>
            <option>Workshop</option>
            <option>Social</option>
            <option>Other</option>
          </select>
          <p class="field-error mt-1 text-xs text-clay hidden" data-for="eventType"></p>
        </div>
        <div>
          <label class="mb-1.5 block text-[11px] font-medium uppercase tracking-[0.08em] text-muted" for="attendees">Attendees</label>
          <input type="number" name="attendees" id="attendees" min="1" required class="w-full rounded border border-rule bg-paper px-3 py-2.5 text-sm text-ink outline-none focus:border-ink/40 focus:ring-1 focus:ring-ink/10" />
          <p class="field-error mt-1 text-xs text-clay hidden" data-for="attendees"></p>
        </div>
        <div class="sm:col-span-2">
          <label class="mb-1.5 block text-[11px] font-medium uppercase tracking-[0.08em] text-muted" for="departmentManagerId">Department manager</label>
          <select name="departmentManagerId" id="departmentManagerId" required class="w-full rounded border border-rule bg-paper px-3 py-2.5 text-sm text-ink outline-none focus:border-ink/40 focus:ring-1 focus:ring-ink/10">
            <option value="">Select manager…</option>
          </select>
          <p class="field-error mt-1 text-xs text-clay hidden" data-for="departmentManagerId"></p>
        </div>
        <div class="sm:col-span-2">
          <span class="mb-1.5 block text-[11px] font-medium uppercase tracking-[0.08em] text-muted">Additional requirements</span>
          <div id="requirements-box" class="mb-3 grid gap-2 sm:grid-cols-2"><p class="text-sm text-muted">Loading options…</p></div>
          <label class="mb-1.5 block text-[11px] font-medium uppercase tracking-[0.08em] text-muted" for="additionalRequirements">Other notes</label>
          <textarea name="additionalRequirements" id="additionalRequirements" rows="3" class="w-full rounded border border-rule bg-paper px-3 py-2.5 text-sm text-ink outline-none focus:border-ink/40 focus:ring-1 focus:ring-ink/10 resize-y" placeholder="AV, catering, accessibility…"></textarea>
        </div>
      </div>

      <div id="conflict-alert" class="hidden mt-5 border border-clay/40 bg-clay/5 text-ink text-sm px-4 py-3 rounded flex items-start gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" class="text-clay shrink-0 mt-0.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
        <span id="conflict-text">This venue is already booked during the selected time.</span>
      </div>

      <div class="flex items-center gap-3 mt-8 pt-6 border-t border-rule">
        <button type="submit" id="submit-btn" class="inline-flex items-center justify-center rounded px-4 py-2.5 text-sm font-medium text-paper bg-ink hover:bg-ink/90 transition-colors duration-150 disabled:opacity-50">Submit request</button>
        <a href="my-requests.html" class="inline-flex items-center justify-center rounded px-4 py-2.5 text-sm font-medium text-muted hover:text-ink hover:bg-rule/40 transition-colors duration-150">Cancel</a>
      </div>
    </form>

    <section id="submit-success" class="hidden max-w-xl" aria-live="polite">
      <div class="rounded border border-rule bg-paper p-6">
        <div class="mb-4 flex items-center gap-3">
          <span class="flex h-10 w-10 items-center justify-center rounded-full bg-accent text-lg text-paper">✓</span>
          <div>
            <h2 class="font-display text-2xl font-medium tracking-[-0.02em]">Request submitted</h2>
            <p class="text-sm text-muted">Your booking was recorded. You don't need to submit it again.</p>
          </div>
        </div>
        <dl id="success-details" class="mb-5 grid grid-cols-[110px_1fr] gap-x-4 gap-y-2 text-sm"></dl>
        <p id="success-next" class="mb-5 rounded bg-rule/30 px-3 py-2 text-sm"></p>
        <div class="flex flex-wrap gap-3">
          <a id="success-view" href="my-requests.html" class="inline-flex items-center justify-center rounded px-4 py-2.5 text-sm font-medium text-paper bg-ink hover:bg-ink/90 transition-colors duration-150">View this request</a>
          <a href="my-requests.html" class="inline-flex items-center justify-center rounded px-4 py-2.5 text-sm font-medium border border-rule hover:bg-rule/40 transition-colors duration-150">My requests</a>
          <a href="booking-form.html" class="inline-flex items-center justify-center rounded px-4 py-2.5 text-sm font-medium text-muted hover:text-ink hover:bg-rule/40 transition-colors duration-150">Book another</a>
        </div>
      </div>
    </section>
  </div>
  <script type="module">
    import '../js/app.js';
    import { getVenues, getUsers, createBooking, getRequirementOptions, getRequirementAvailability } from '../js/api.js';
    import { escapeHtml, debounce } from '../js/utils.js';
    import { pageHeader } from '../js/ui.js';
    import { validateBookingForm } from '../js/validators.js';
    import { mountBookingCalendar } from '../components/booking-calendar.js';
    import { toast } from '../components/toast.js';
    import { formatDate, formatTime } from '../js/utils.js';

    window.__pageInit = async function () {
      document.getElementById('page-header').innerHTML = pageHeader({
        description: 'Submit a venue booking request for manager validation and HR approval.',
      });

      const venueSel = document.getElementById('venueId');
      const mgrSel = document.getElementById('departmentManagerId');

      try {
        const venues = await getVenues({ status: 'Available' });
        const vlist = Array.isArray(venues) ? venues : venues?.items || [];
        vlist.forEach((v) => {
          const opt = document.createElement('option');
          opt.value = v.id;
          opt.textContent = `${v.name}${v.capacity ? ` (cap. ${v.capacity})` : ''}`;
          venueSel.appendChild(opt);
        });
      } catch {}

      try {
        const users = await getUsers({ role: 'Manager' });
        const ulist = Array.isArray(users) ? users : users?.items || [];
        ulist.forEach((u) => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = u.name || u.email;
          mgrSel.appendChild(opt);
        });
      } catch {}

      const form = document.getElementById('booking-form');
      const conflictAlert = document.getElementById('conflict-alert');
      const conflictText = document.getElementById('conflict-text');

      let onSelectionChange = () => {};
      const calendar = mountBookingCalendar(document.getElementById('booking-calendar'), {
        onChange: ({ date, startTime, endTime }) => {
          form.date.value = date;
          form.startTime.value = startTime;
          form.endTime.value = endTime;
          conflictAlert.classList.add('hidden');
          onSelectionChange();
        },
      });
      venueSel.addEventListener('change', () => calendar.setVenue(venueSel.value));

      // ── Additional requirements with live stock for the chosen venue / date / time ──
      const reqBox = document.getElementById('requirements-box');
      let reqOptions = [];
      let reqAvail = null; // Map optionId -> { total, available, scope }
      let reqSeq = 0;

      function renderReqs(announce = false) {
        const prev = new Map([...reqBox.querySelectorAll('.req-check')].map((c) => [
          c.value,
          { checked: c.checked, qty: reqBox.querySelector(`.req-qty[data-id="${c.value}"]`)?.value },
        ]));
        const removed = [];
        const hint = reqAvail
          ? ''
          : '<p class="text-xs text-muted sm:col-span-2">Pick a venue, date and time to see what equipment is available.</p>';
        const items = reqOptions.map((o) => {
          const a = reqAvail?.get(o.id);
          const limited = !!a && a.total != null;
          const left = limited ? a.available : null;
          const out = limited && left <= 0;
          const cap = limited ? Math.min(o.maxQuantity, left) : o.maxQuantity;
          const p = prev.get(String(o.id));
          if (announce && p?.checked && out) removed.push(o.name);
          const checked = !!p?.checked && !out;
          const qty = Math.max(1, Math.min(Number(p?.qty) || 1, cap || 1));
          let note = '';
          if (limited) note = out ? 'Unavailable at this time' : `${left} of ${a.total} available${a.scope === 'PerVenue' ? ' in this room' : ''}`;
          else if (o.totalStock != null) note = `${o.totalStock} in stock`;
          return `
          <label class="flex items-center gap-2 rounded border border-rule px-3 py-2 text-sm ${out ? 'opacity-50' : ''}">
            <input type="checkbox" class="req-check" value="${o.id}" ${checked ? 'checked' : ''} ${out ? 'disabled' : ''} />
            <span class="flex-1">${escapeHtml(o.name)}${o.description ? `<span class="block text-xs text-muted">${escapeHtml(o.description)}</span>` : ''}${note ? `<span class="block text-xs ${out ? 'text-clay' : 'text-accent'}">${escapeHtml(note)}</span>` : ''}</span>
            ${cap > 1 ? `<input type="number" min="1" max="${cap}" value="${qty}" data-id="${o.id}" class="req-qty w-16 rounded border border-rule px-2 py-1 text-sm" />` : ''}
          </label>`;
        });
        reqBox.innerHTML = hint + (items.join('') || '<p class="text-sm text-muted">No options configured.</p>');
        reqBox.querySelectorAll('.req-qty').forEach((i) => i.addEventListener('change', () => {
          const max = Number(i.max);
          i.value = Math.max(1, Math.min(Number(i.value) || 1, max));
        }));
        if (removed.length) {
          toast(`${removed.join(', ')} ${removed.length > 1 ? 'are' : 'is'} not available for that time and was unselected.`, 'error');
        }
      }

      async function loadAvail() {
        const q = { venueId: form.venueId.value, date: form.date.value, startTime: form.startTime.value, endTime: form.endTime.value };
        const seq = ++reqSeq;
        if (!q.venueId || !q.date || !q.startTime || !q.endTime) {
          reqAvail = null;
          renderReqs();
          return;
        }
        try {
          const list = await getRequirementAvailability(q);
          if (seq !== reqSeq) return; // a newer request superseded this one
          reqAvail = new Map(list.map((a) => [a.optionId, a]));
        } catch {
          if (seq !== reqSeq) return;
          reqAvail = null;
        }
        renderReqs(true);
      }
      const scheduleAvail = debounce(loadAvail, 250);
      onSelectionChange = () => {
        if (form.venueId.value && form.date.value && form.startTime.value && form.endTime.value) scheduleAvail();
        else loadAvail();
      };

      try {
        reqOptions = await getRequirementOptions();
        renderReqs();
      } catch {
        reqBox.innerHTML = '<p class="text-sm text-muted">Options unavailable.</p>';
      }

      function showConfirmation(b, f) {
        const ref = b?.ref || '(reference pending)';
        const next = {
          'Pending Manager Validation': 'Next: your department manager validates the request, then HR makes the final decision. You will get a notification at each step.',
          'Pending HR Decision': 'Next: HR reviews your request and makes the final decision. You will get a notification.',
          Approved: 'This booking is already approved. The venue is reserved for you.',
        }[b?.status] || 'You can follow its progress under My requests.';
        const row = (k, v) => `<dt class="text-muted">${k}</dt><dd class="font-medium">${escapeHtml(String(v ?? '—'))}</dd>`;
        document.getElementById('success-details').innerHTML =
          row('Reference', ref) +
          row('Venue', b?.venueName) +
          row('Date', b?.date ? formatDate(b.date) : f.date) +
          row('Time', `${formatTime(b?.startTime || f.startTime)} – ${formatTime(b?.endTime || f.endTime)}`) +
          row('Status', b?.status);
        document.getElementById('success-next').textContent = next;
        if (b?.id) document.getElementById('success-view').href = `booking-details.html?id=${encodeURIComponent(b.id)}`;
        form.classList.add('hidden');
        document.getElementById('submit-success').classList.remove('hidden');
        toast(`Request ${ref} submitted successfully.`, 'success');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        document.querySelectorAll('.field-error').forEach((el) => {
          el.classList.add('hidden');
          el.textContent = '';
        });

        const fields = {
          venueId: form.venueId.value,
          date: form.date.value,
          startTime: form.startTime.value,
          endTime: form.endTime.value,
          purpose: form.purpose.value.trim(),
          eventType: form.eventType.value,
          attendees: form.attendees.value,
          departmentManagerId: form.departmentManagerId.value,
          additionalRequirements: form.additionalRequirements.value.trim(),
          requirements: [...document.querySelectorAll('#requirements-box .req-check:checked')].map((c) => ({
            optionId: Number(c.value),
            quantity: Number(document.querySelector(`#requirements-box .req-qty[data-id="${c.value}"]`)?.value || 1),
          })),
        };

        const errors = validateBookingForm(fields);
        if (Object.keys(errors).length) {
          for (const [k, msg] of Object.entries(errors)) {
            const el = document.querySelector(`.field-error[data-for="${k}"]`);
            if (el) {
              el.textContent = msg;
              el.classList.remove('hidden');
            }
          }
          return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = 'Submitting…';
        let saved = false;
        try {
          const booking = await createBooking(fields);
          saved = true; // keep the button disabled so it can't be sent twice
          showConfirmation(booking, fields);
        } catch (err) {
          if (err.status === 409 || err.status === 422) {
            conflictText.textContent = err.message;
            conflictAlert.classList.remove('hidden');
            await calendar.refresh(); // someone may have just taken the slot
            await loadAvail(); // ...or the last projector
          } else {
            toast(err.message || 'Could not submit the request.', 'error');
          }
        } finally {
          if (!saved) {
            btn.disabled = false;
            btn.textContent = 'Submit request';
          }
        }
      });
    };
  </script>
</body>
</html>
